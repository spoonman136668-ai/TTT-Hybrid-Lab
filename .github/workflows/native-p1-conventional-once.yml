# One-use synthetic-engineering-only exact-source qualification for Native P1 controls.
# No science source generation, seeds, fit, GPU, installs, or research-loop changes.
name: Native P1 conventional comparator engineering one-use
on:
  push:
    branches:
      - engineering/native-p1-conventional-admission-20261108
    paths:
      - .github/workflows/native-p1-conventional-once.yml
permissions:
  contents: read
concurrency:
  group: native-p1-controls-engineering-single-use
  cancel-in-progress: false
jobs:
  windows-and-wsl:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p1-conventional-admission-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p1-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 120
      - name: Admit original source and protected unconsumed science
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'BLOCKED_PROJECT_RUNNER_ONEUSE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p1-candidate'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_EXACT_SOURCE'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_DIRTY_SOURCE'}
          & git -C $root merge-base --is-ancestor '35501945e619298ce5a093f0b23f20a95f55c380' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P0_ANCESTOR'}
          $expected=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_continuous_state.py'='38ebbfb339026f3213a8c380e090480609288917';
            'experiments/native_prequential_p0_engineering_frozen.json'='167a9cea7b3feae3bd20a9856c0e072a5e4c6b34';
            'scripts/native_p1_conventional_controls.py'='197e7ce4044bd5e8b533545985f93a90a1d0451c';
            'scripts/native_p1_seed_admission.py'='a0f55a654b51ec75dfd154e057f733a47d8a057f';
            'tests/test_native_p1_conventional_admission.py'='2e1efb452519fe16ce963e4fea4872679bc72a1c';
            'experiments/native_p1_control_admission_preflight.json'='9de1caedb56f1248264ac37db08ec66b8265fe16'
          }
          foreach($name in $expected.Keys){
            $hash=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $hash -cne $expected[$name]){throw "BLOCKED_SOURCE_BLOB:$name"}
          }
          $p=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p1_control_admission_preflight.json') -Raw|ConvertFrom-Json
          if($p.science.authorized -ne $false -or $p.science.data_consumed -ne $false -or @($p.science.seeds.PSObject.Properties).Count -ne 0 -or $p.engineering.model_fit_real_world -ne $false){throw 'BLOCKED_SCIENCE_FIRSTUSE_SCOPE'}
          $win=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $win -PathType Leaf)){throw 'BLOCKED_EXISTING_CPU311'}
          $torch=(& $win -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          $pytest=(& $win -I -B -c 'import pytest;print(pytest.__version__)'|Out-String).Trim()
          if($torch -cne '2.5.1+cpu' -or $pytest -cne '8.3.4'){throw 'BLOCKED_WIN_RUNTIME_VERSION'}
          Write-Output 'NATIVE_P1_EXACT_SHA_SOURCE_AND_ZERO_SCIENCE_FIRSTUSE=PASS'
      - name: Full Windows regression and upstream negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p1-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p1_windows.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WIN_FULL_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p1_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WIN_RECEIPT'}
          Write-Output 'NATIVE_P1_WINDOWS_FULL_REGRESSION=PASS_ENGINEERING_ONLY'
      - name: Full Ubuntu WSL regression and upstream negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'BLOCKED_WSL_OWNER'}
          $root="$lp/native-p1-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $receipt="$root/local_runs/native_p1_linux.json"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WSL_FULL_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p1-candidate\local_runs\native_p1_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WSL_RECEIPT'}
          Write-Output 'NATIVE_P1_WSL_FULL_REGRESSION=PASS_ENGINEERING_ONLY'
      - name: Retain immutable Windows WSL source-scoped engineering receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p1-controls-eng-once
          path: native-p1-candidate/local_runs/native_p1_*.json
          retention-days: 30
          if-no-files-found: warn
