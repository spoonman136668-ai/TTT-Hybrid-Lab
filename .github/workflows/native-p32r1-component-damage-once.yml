# P32 original owner: actual reward-only PPO actor-head vs recurrent-state component damage.
# Frozen original source, first-use isolated, all original mandatory full regressions.
# No third-party action-download, no new runner, no controller or scheduler.
name: Native P32-R1 original source corrected historical fence once
on:
  push:
    branches:
      - engineering/native-p32-actor-versus-recurrence-damage-dev-20261108
    paths:
      - .github/workflows/native-p32r1-component-damage-once.yml
permissions:
  contents: read
concurrency:
  group: native-p32r1-component-damage-oneuse
  cancel-in-progress: false
jobs:
  native-exact-source-public-dev:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p32-actor-versus-recurrence-damage-dev-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 26
    env:
      GH_REPO_TOKEN: ${{ github.token }}
    steps:
      - name: Native exact-SHA Git transport, immutable source custody and original science fence
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'P32R1_ORIGINAL_OWNER_ONEUSE_DENIED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p32r1-candidate'
          if(Test-Path -LiteralPath $root){throw 'P32R1_ROOT_EXISTS_NO_OVERWRITE'}
          if([string]::IsNullOrWhiteSpace($env:GH_REPO_TOKEN)){throw 'P32_READONLY_GIT_TOKEN_MISSING'}
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GIT_LFS_SKIP_SMUDGE='1'
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_REPO_TOKEN"))
          $env:GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          try {
            & git clone --quiet --no-tags --single-branch --depth 160 --branch engineering/native-p32-actor-versus-recurrence-damage-dev-20261108 "https://github.com/$env:GITHUB_REPOSITORY.git" "$root"
            if($LASTEXITCODE -ne 0){throw 'P32_NATIVE_READONLY_GIT_CLONE_FAILED'}
          } finally {
            Remove-Item Env:\GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:\GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:\GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
            Remove-Variable auth -ErrorAction SilentlyContinue
          }
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'P32_EXACT_CANDIDATE_SHA_NOT_CHECKED_OUT'}
          & git -C $root merge-base --is-ancestor '8fe7cb4b9e1e4e9b9188065671eed005911819f1' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_ORIGINAL_P30_QUALIFIED_SOURCE_NOT_ANCESTOR'}
          & git -C $root merge-base --is-ancestor 'ded38602dbc530f5457d92337cf8cc5c1611f865' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_PROSPECTIVE_RETENTION_PROTOCOL_NOT_ANCESTOR'}
          & git -C $root merge-base --is-ancestor 'ec4eb7861ba750b8ae3ac7802af3f093a894c4a8' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_PROSPECTIVE_DUPLICATE_BLOB_KEY_RECOVERY_MISSING'}
          $recover=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p31r1_blob_pin_recovery_frozen.json') -Raw | ConvertFrom-Json
          if($recover.schema -cne 'ttt-hybrid.native-p31r1.duplicate-historical-blob-key-recovery.v1' -or $recover.status -cne 'FROZEN_BEFORE_ONE_USE_OWNER_RECOVERY' -or $recover.origin.original_run -ne 42545658087 -or $recover.origin.original_source_clone_executed -ne $false -or $recover.origin.original_experiment_run -ne $false -or $recover.repair.protected_science_first_use_not_run -ne $true){throw 'P32_ORIGINAL_PRECHECK_FAILURE_OR_SOURCE_CUSTODY_DRIFT'}
          & git -C $root merge-base --is-ancestor '3e2f2c422cc81a5c5a32421d142e3f4130441bbf' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_SCRIPT_RECOVERY_FREEZE_NOT_ANCESTOR'}
          $entryRecovery=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p31r2_script_entrypoint_recovery_frozen.json') -Raw | ConvertFrom-Json
          if($entryRecovery.schema -cne 'ttt-hybrid.native-p31r2.original-experiment-entrypoint-recovery-frozen.v1' -or $entryRecovery.status -cne 'FROZEN_BEFORE_RECOVERY_WORKFLOW_AND_SOURCE_USE' -or $entryRecovery.original_run.id -ne 42546004191 -or $entryRecovery.original_run.original_P31_training_started -ne $false -or $entryRecovery.original_run.protected_first_use_consumed -ne $false -or $entryRecovery.repair.no_scientific_first_use -ne $true){throw 'P32_ORIGINAL_P32_WORLD_UNCONSUMED_FENCE_FAIL'}
          $m=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p31_policy_retention_frozen.json') -Raw | ConvertFrom-Json
          if($m.schema -cne 'ttt-hybrid.native-p31.reward-only-policy-retention-frozen.v1' -or $m.phase -cne 'PROSPECTIVE_FROZEN_BEFORE_CODE_OR_SOURCE_USE' -or $m.original.parent_exact_SHA -cne '8fe7cb4b9e1e4e9b9188065671eed005911819f1' -or $m.source.protected_science_first_use -ne $false -or @($m.training.model_initialization_seeds).Count -ne 3 -or $m.training.model_initialization_seeds[0] -ne 4507 -or @($m.training.trained_arms).Count -ne 3 -or $m.training.initial_policy_KL_beta -ne 1.0 -or $m.training.new_public_original_source_reset_base -ne 134000 -or @($m.evaluation.new_public_original_reset_seeds).Count -ne 8){throw 'P32_FROZEN_SCIENCE_PROTOCOL_OR_SOURCE_DRIFT'}
          & git -C $root merge-base --is-ancestor 'af574a87a9c81e5dc1b5e703dacf315606494e0a' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_ORIGINAL_P31_R2_QUALIFIED_PARENT_SHA_DRIFT'}
          & git -C $root merge-base --is-ancestor '83c00598ae5d3bf75bb667ac3a4594c205285e2e' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32_ORIGINAL_FROZEN_COMPONENT_PROTOCOL_SHA_DRIFT'}
          & git -C $root merge-base --is-ancestor 'b7256fcf43b77f6595432192242d1dafff6599a1' HEAD
          if($LASTEXITCODE -ne 0){throw 'P32R1_FROZEN_OWNER_PREFLIGHT_RECOVERY_NOT_ANCESTOR'}
          $recovery32=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p32r1_historical_fence_recovery_frozen.json') -Raw | ConvertFrom-Json
          if($recovery32.schema -cne 'ttt-hybrid.native-p32r1.p31-historical-source-fence-typo-recovery.v1' -or $recovery32.status -cne 'FROZEN_AFTER_ZERO_SOURCE_WORK_BEFORE_ANY_RECOVERY_EXECUTION' -or $recovery32.origin.original_oneuse_run -ne 42548326594 -or $recovery32.origin.P32_original_training_started -ne $false -or $recovery32.repair.no_protected_scientific_first_use -ne $true){throw 'P32R1_ZERO_SOURCE_ACTIONS_RECOVERY_FENCE_FAILED'}
          $p32frozen=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p32_component_damage_frozen.json') -Raw|ConvertFrom-Json
          if($p32frozen.schema -cne 'ttt-hybrid.native-p32.actor-vs-recurrent-source-reward-frozen.v1' -or $p32frozen.phase -cne 'FROZEN_BEFORE_IMPLEMENTATION_AND_PUBLIC_SOURCE_USE' -or $p32frozen.source.protected_scientific_first_use -ne $false -or $p32frozen.parent.sha -cne 'af574a87a9c81e5dc1b5e703dacf315606494e0a' -or @($p32frozen.training.model_seeds).Count -ne 3 -or $p32frozen.training.train_original_source_reset_base -ne 144000 -or @($p32frozen.training.arms).Count -ne 4 -or @($p32frozen.evaluation.original_heldout_reset_seeds).Count -ne 8){throw 'P32_FROZEN_ORIGINAL_COMPONENT_SCIENCE_FENCE_FAILED'}
          $protected=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'scripts/native_p18_real_cartpole_factual_dev.py'='0c5c0079614624d1264e477ea90b483cbe63d586';
            'scripts/native_p20_reward_only_ppo_dev.py'='cd9507b3cd86bca0d1507b1e234dcaaf5919e8f4';
            'scripts/native_p25_paired_action_consequence_dev.py'='6c07b1738c8c50f2ca9d8e13eb0ebee01424f45e';
            'tests/test_native_p25_paired_action_consequence_dev.py'='97df4ad8c0543a1a7e60eb98d69dcff9c8c9b704';
            'experiments/native_p25_paired_action_consequence_frozen.json'='05af59eb4b0d980a18c0621c94e8265b3fe9d52f';
            'experiments/native_p25r1_json_custody_repair_frozen.json'='8a4bdfbc3af2f8b4ff9d2894d9933a734d5783f3';
            'experiments/native_p27_state_dependent_effect_frozen.json'='0daeb55af2c80b7fcda4fd451f6ef0ff65a556e6';
            'scripts/native_p27_state_dependent_effect_dev.py'='16a87a9a18be588991377a9bed1dccc298edfba7';
            'tests/test_native_p27_state_dependent_effect_dev.py'='c28c1996836d8daea710d3150ce16e35cc0b4efe';
            'experiments/native_p28_physical_history_identifiability_frozen.json'='986d4f89c219e95f653e6abd160b82eb4543fb02';
            'scripts/native_p28_physical_history_identifiability_dev.py'='156185a18b3b8aee23991ee01fd67ea6679c3fe4';
            'tests/test_native_p28_physical_history_identifiability_dev.py'='ab9eb99883fe92b5b482e38250d10fd39d59e0f6';
            'experiments/native_p29_feature_access_frozen.json'='8662dc5315475e018dc3a53dfd02d1b230a45983';
            'scripts/native_p29_feature_access_dev.py'='a5dacc8b3b7a6900f33d485f9b88a4289265d18c';
            'tests/test_native_p29_feature_access_dev.py'='7058bdf8444bef3c2e9e2e71af8eb8e52f6d7ea0';
            'experiments/native_p30_reward_motion_ppo_frozen.json'='fb17b091ec94dcae2e8164a552f3fd23646213fd';
            'scripts/native_p30_reward_motion_ppo_dev.py'='6d864593732cda1413a6338bc2e42ad9c6a85629';
            'tests/test_native_p30_reward_motion_ppo_dev.py'='885739b1f6f5c4ee19029bcb0c488dc6671e02fc';
            'experiments/native_p30r1_workflow_recovery_frozen.json'='be8b8f0615658c98ac6d67750a8bd945acd5e96e';
            'experiments/native_p31_policy_retention_frozen.json'='8d1d5f62e938f59151b3b4c847de8beb47bc37d3';
            'scripts/native_p31_policy_retention_dev.py'='0b2ae9eebf2e36ae659fddd8cf88178f12b23c4e';
            'tests/test_native_p31_policy_retention_dev.py'='77762d93fab492a87b2856366fd927cdb7fff3e4';
            'experiments/native_p31r1_blob_pin_recovery_frozen.json'='2707bf34af954c94369abffb3e53f31b2dd66cd9';
            'experiments/native_p31r2_script_entrypoint_recovery_frozen.json'='b02df02d7f1c2100c2d2f6a225c3b0a9581a06d0';
            'experiments/native_p32_component_damage_frozen.json'='ccc539c700664dc87270273903f5aaecdfba56ed';
            'scripts/native_p32_component_damage_dev.py'='793ac4153353754c0754c76655663af74cb9c0a5';
            'tests/test_native_p32_component_damage_dev.py'='a4064d9d1dbfa4f2b64463d3c08ded2ad84d1c84';
            'experiments/native_p32r1_historical_fence_recovery_frozen.json'='7f10da18ab7b1f741f7f134375c75960ff2a1bbd';
          }
          foreach($name in $protected.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $protected[$name]){throw "P32_SOURCE_BLOB_CHANGED:$name"}
          }
          $source=@{
            'native-p25-s29-owner'='30c27ca4865e16b7574ee2b562879108db2b3796';
            'native-p25-mit-gym'='17eff00220d210beda933f78b0e52850022b0690';
            'native-p25-bsd3-cloudpickle'='ff54d93221082d4ce22630ecdb8fbbccc60f3b62'
          }
          foreach($name in $source.Keys){
            $dir=Join-Path $env:GITHUB_WORKSPACE $name
            if(-not(Test-Path -LiteralPath $dir -PathType Container)){throw "P32_ORIGINAL_READONLY_SOURCE_MISSING:$name"}
            $sha=(& git -C $dir rev-parse HEAD|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $source[$name]){throw "P32_ORIGINAL_SOURCE_SHA_MISMATCH:$name"}
            $dirty=(& git -C $dir status --porcelain --untracked-files=all|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $dirty){throw "P32_ORIGINAL_SOURCE_DIRTY:$name"}
          }
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'P32_CANDIDATE_DIRTY_BEFORE_TEST'}
          if(-not(Test-Path -LiteralPath (Join-Path $root 'scripts/native_p32_component_damage_dev.py') -PathType Leaf)){throw 'P32_CORRECT_ENTRYPOINT_SOURCE_ABSENT'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P32_QUALIFIED_CPU_INTERPRETER_MISSING'}
          $versions=@(& $py -I -B -c 'import torch,pytest,numpy;print(torch.__version__);print(pytest.__version__);print(numpy.__version__)')
          if($LASTEXITCODE -ne 0 -or $versions.Count -ne 3 -or $versions[0] -cne '2.5.1+cpu' -or $versions[1] -cne '8.3.4' -or $versions[2] -cne '1.26.4'){throw 'P32_QUALIFIED_CPU_TOOLCHAIN_DRIFT'}
          Write-Output "P32_ORIGINAL_OWNER_SOURCE_AND_TRANSPORT=PASS SHA=$head PRIOR_P29_QUALIFIED_P26_UNCHANGED"
      - name: Mandatory full Windows final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p32r1-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:OMP_NUM_THREADS='1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p32r1_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P32_WINDOWS_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p32r1_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P32_WINDOWS_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P32_WINDOWS_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: Mandatory full Ubuntu WSL final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'P32_ORIGINAL_UBUNTU_WSL_OWNER_DRIFT'}
          $root="$lp/native-p32r1-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p32r1_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P32_UBUNTU_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p32r1-candidate\local_runs\native_p32r1_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P32_UBUNTU_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P32_UBUNTU_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: One original source reward PPO actor and recurrent damage comparison
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $who -or -not $lp){throw 'P32_SOURCE_WSL_NOT_AVAILABLE'}
          $root="$lp/native-p32r1-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 710s /usr/bin/env 'NATIVE_P20_DEV_ONLY=1' 'NATIVE_P32_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/native_p32_component_damage_dev.py" --s29-root "$lp/native-p25-s29-owner" --source-root "$lp/native-p25-mit-gym" --cloudpickle-root "$lp/native-p25-bsd3-cloudpickle" --receipt "$root/local_runs/native_p32r1_component_damage.json"
          if($LASTEXITCODE -ne 0){throw 'P32_GENUINE_FACTUAL_ACTION_ASSAY_FAILED'}
          $rp=Join-Path $env:GITHUB_WORKSPACE 'native-p32r1-candidate\local_runs\native_p32r1_component_damage.json'
          $p=Get-Content -LiteralPath $rp -Raw|ConvertFrom-Json
          if($p.engineering -cne 'PASS_ORIGINAL_PUBLIC_DEV_ONLY' -or $p.protected_scientific_first_use -cne 'NOT_RUN' -or @($p.records).Count -ne 3 -or $p.total_original_real_training_actions -ne 589824 -or $p.total_original_source_optimizer_minibatches -ne 6912 -or $p.original_source_probe.original_source_executed_probe_actions -lt 500 -or $p.original_P31_positive_and_negative_results_unchanged -ne $true -or $p.no_model_promotion_or_FORGE_activation -ne $true){throw 'P32_ORIGINAL_COMPONENT_ACTIONS_OR_SCIENCE_FENCE_FAILED'}
          $checksum=(Get-FileHash -Algorithm SHA256 -LiteralPath $rp).Hash.ToLowerInvariant()
          $summary=@()
          foreach($rec in @($p.records)){
            $train=@{}
            foreach($name in @('full_actor_recurrent_ppo','actor_head_only_ppo','recurrent_only_ppo','critic_only_frozen_policy')){
              $t=$rec.actual_train_receipts.PSObject.Properties[$name].Value
              $train[$name]=@{
                first_512_source_actions_sha256=$t.first_512_real_source_actions_trace_sha256
                real_source_train_actions=$t.real_original_train_source_actions
                original_PPO_minibatch_updates=$t.original_ppo_minibatch_updates
                source_real_train_trace_sha256=$t.original_actual_action_consequence_sha256
                initial_model_sha256=$t.initial_source_actor_weights_sha256
                exact_cold_trained_model_sha256=$t.trained_source_actor_critic_weights_sha256
                bitwise_unchanged_original_components=$t.components_bit_exact_unchanged_from_original
                frozen_component_names=$t.frozen_component_names
                actual_trainable_model_parameters=$t.trained_parameters_effective
                real_heldout_factual_episode_training_curve=$t.train_curve_actual_source_episodes
              }
            }
            $summary+=@{
              model_seed=$rec.model_seed
              historical_positive_selected=$rec.selected_historically_favorable_initialization
              fresh_initial_admitted=$rec.fresh_initial_source_qualified_for_damage_at_150
              original_full_PPO_damage=$rec.full_PPO_damage_25_on_fresh_original
              component_sufficient_damage=$rec.component_sufficient_for_selected_initial_damage_25
              component_retention=$rec.component_retained_selected_initial_20_and_vs_full_25
              attribution_classification=$rec.frozen_component_diagnostic_class
              heldout_reward_returns_by_source_physics=$rec.real_source_reward_means_by_condition
              original_physical_actor_probe_KL=$rec.source_factual_drift_probe
              new_seed_general_acquisition_rules=$rec.all_condition_general_acquisition_gates
              original_real_source_training=$train
            }
          }
          Write-Output "P32_COMPLETE_REAL_SOURCE_RECEIPT_SHA256=$checksum"
          $report=@{
            engineering=$p.engineering
            protected_scientific_first_use=$p.protected_scientific_first_use
            selected_initial_admitted=$p.selected_seed_4507_original_initial_admitted
            selected_full_PPO_damage=$p.selected_seed_4507_full_PPO_damage
            selected_actor_head_only_damage=$p.selected_seed_4507_actor_head_only_damage
            selected_recurrent_only_damage=$p.selected_seed_4507_recurrent_only_damage
            selected_source_component_attribution=$p.selected_seed_4507_attribution
            all_new_seed_general_acquisition=$p.frozen_component_general_acquisition_all_three_seeds
            real_training_source_actions=$p.total_original_real_training_actions
            real_optimizer_minibatches=$p.total_original_source_optimizer_minibatches
            real_evaluation_source_actions=$p.total_original_real_eval_actions
            probe_source_custody=$p.original_source_probe
            whole_source_process_seconds=$p.whole_real_source_wall_seconds
            seeds=$summary
          }
          Write-Output ("P32_FROZEN_ACTOR_RECURRENCE_SOURCE_RESULT_JSON="+($report|ConvertTo-Json -Compress -Depth 12))
          Write-Output "P32_EXACT_OWNER_ENGINEERING=PASS SELECTED_FULL_PPO_DAMAGE=$($p.selected_seed_4507_full_PPO_damage) SELECTED_ATTRIBUTION=$($p.selected_seed_4507_attribution) GENERAL_ACQUISITION=$($p.frozen_component_general_acquisition_all_three_seeds)"
      - name: Preserve local P32 source-policy receipts and hashes without downloadable GitHub actions
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p32r1-candidate'
          if(Test-Path -LiteralPath (Join-Path $root 'local_runs')){
            $dir=Join-Path $root 'local_runs'
            $files=@(Get-ChildItem -LiteralPath $dir -File -Filter 'native_p32r1_*.json')
            if($files.Count -gt 0){
              $zip=Join-Path $dir 'native_p32r1_owner_receipts.zip'
              if(-not(Test-Path -LiteralPath $zip)){
                Compress-Archive -LiteralPath @($files|ForEach-Object{$_.FullName}) -DestinationPath $zip -CompressionLevel Optimal
              }
              if(Test-Path -LiteralPath $zip){
                $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
                $bytes=(Get-Item -LiteralPath $zip).Length
                Write-Output "P32_LOCAL_RECEIPTS_ZIP=SHA256:$hash BYTES:$bytes FILES:$($files.Count) ROOT:$dir"
              }
            }else{Write-Output 'P32_ORIGINAL_RUN_ENTERED_NO_NATIVE_RECEIPTS'}
          }else{Write-Output 'P32_NO_SOURCE_STEPS_EXECUTED_NO_RECEIPTS'}
