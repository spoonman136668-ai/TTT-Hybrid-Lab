name: P85MR-F5 owner one-shot native Hybrid FIT-CAL comparison
on:
  push:
    branches:
      - research/p85mr-f5-native-hybrid-vs-competent-controls-20261111
    paths:
      - .github/workflows/p85mr-f5-native-fitcal-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ttt-hybrid-p85mr-f5-native-once
  cancel-in-progress: false

jobs:
  native-fitcal:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/research/p85mr-f5-native-hybrid-vs-competent-controls-20261111' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 165
    steps:
      - name: Checkout exact owner F5 candidate without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: p85mr-f5
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          fetch-depth: 1

      - name: Verify exact owner route, source SHA and frozen science blobs
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $expectedRef='refs/heads/research/p85mr-f5-native-hybrid-vs-competent-controls-20261111'
          $wf='spoonman136668-ai/TTT-Hybrid-Lab/.github/workflows/p85mr-f5-native-fitcal-once.yml@'+$expectedRef
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
             $env:GITHUB_REF -cne $expectedRef -or $env:GITHUB_WORKFLOW_REF -cne $wf -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
             $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
             $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$'){throw 'F5_WRONG_OWNER_OR_REPLAY'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f5'
          $actual=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA -or $dirty){
            throw 'F5_SOURCE_SHA_OR_CLEAN_TREE_FAIL'
          }
          $blobs=@{
            'experiments/p85mr_f5_native_vs_controls_freeze.json'='ba24ca8b9f3146c4c1be55b37d980d044b123676';
            'experiments/p85mr_f5_native_vs_controls.py'='c89c93d1c4ddb33e7d434197c48960624682666f';
            'tests/test_p85mr_f5_native_vs_controls.py'='8d7dd103b1bf306c944bab04f288cd2f9cf52469';
            'model.py'='5d9ea57b827aa1796548447868fa5ee14c251b49';
            'experiments/p85mr_f4_controls_freeze.json'='d8136313dd90cc406f00c49770ed3beeff4a1ee4';
            'experiments/p85mr_strong_baseline_freeze.json'='85ae6d1eee3332ef55a653b678733e012cb57158'
          }
          foreach($path in $blobs.Keys){
            $observed=(& git -C $root hash-object -- $path | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $observed -cne $blobs[$path]){
              throw 'F5_FROZEN_PROJECT_SOURCE_DRIFT'
            }
          }
          Write-Output 'F5_SOURCE_FROZEN_OWNER_FIRSTRUN=PASS'

      - name: Full original native Windows CPU regression and negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f5'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'F5_WINDOWS_QUALIFIED_PYTHON_ABSENT'}
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1'
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONHASHSEED='0'
          $receipt=Join-Path $root 'local_runs\p85mr_f5_windows_cpu.json'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'F5_WINDOWS_FULL_REGRESSION_FAIL'}
          $q=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or
             $q.checkout_identity.pass -ne $true -or $q.negative_control.pass -ne $true -or
             $q.tests.exit_code -ne 0){throw 'F5_WINDOWS_SOURCE_OR_NEGATIVE_RECEIPT_FAIL'}

      - name: Full original WSL CPU regression and negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f5'
          $linux=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u $root | Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un | Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or
             $who -cnotmatch '^[A-Za-z_][A-Za-z0-9_-]{0,32}$' -or
             $linux -cnotmatch '^/mnt/[a-z]/[a-zA-Z0-9._/-]{1,260}$'){throw 'F5_WRONG_WSL_OWNER'}
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $envs=@("EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA",
                  'CUDA_VISIBLE_DEVICES=-1','PYTHONDONTWRITEBYTECODE=1','PYTHONHASHSEED=0')
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 720s /usr/bin/env @envs $py -I -B "$linux/scripts/qualify_cpu.py" --receipt "$linux/local_runs/p85mr_f5_wsl_cpu.json"
          if($LASTEXITCODE -ne 0){throw 'F5_WSL_FULL_REGRESSION_FAIL'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\p85mr_f5_wsl_cpu.json') -Raw | ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or
             $q.checkout_identity.pass -ne $true -or $q.negative_control.pass -ne $true -or
             $q.tests.exit_code -ne 0){throw 'F5_WSL_SOURCE_OR_NEGATIVE_RECEIPT_FAIL'}

      - name: Read only authenticated F3 source and F4 trained controls, no new simulator effects
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          F5_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f5'
          $headers=@{Authorization=('Bearer '+$env:F5_GITHUB_READ_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $items=@(
            @{id=13878284321;run=43073165842;head='00b3f45f47660af4c1016c64b656160975982227';sha='a04697bdfba1eb93548244329f4f76fb807489aa7766f4a343de897a56caceb5';file='p85mr_f5_source_F3.zip'},
            @{id=13883054583;run=43080774054;head='00196c634509c7d04962e78988f4da97227f38f6';sha='ac93a3616619bf4376023e18cfc2ab32757a1a89715fbc02394164682c0159b5';file='p85mr_f5_controls_F4.zip'}
          )
          foreach($v in $items){
            $url='https://api.github.com/repos/spoonman136668-ai/TTT-Hybrid-Lab/actions/artifacts/'+$v.id
            $m=Invoke-RestMethod -Uri $url -Method Get -Headers $headers -TimeoutSec 60
            if($m.id -ne $v.id -or $m.expired -ne $false -or
               $m.workflow_run.id -ne $v.run -or $m.workflow_run.head_sha -cne $v.head -or
               $m.digest -cne ('sha256:'+$v.sha)){
              throw 'F5_ORIGINAL_SOURCE_OR_BASELINE_ARTIFACT_CUSTODY_FAIL'
            }
            $dst=Join-Path (Join-Path $root 'local_runs') $v.file
            Invoke-WebRequest -Uri ($url+'/zip') -Method Get -Headers $headers -OutFile $dst -MaximumRedirection 5 -TimeoutSec 150
            $sha=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -cne $v.sha){throw 'F5_ARTIFACT_ZIP_SHA256_FAIL'}
          }
          Write-Output 'F5_F3_AND_F4_ORIGINAL_ARTIFACT_PROVENANCE=PASS_READ_ONLY'

      - name: Original four-block Hybrid owner WSL CPU training and matched CAL comparison
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f5'
          $linux=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u $root | Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un | Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or
             $who -cnotmatch '^[A-Za-z_][A-Za-z0-9_-]{0,32}$' -or
             $linux -cnotmatch '^/mnt/[a-z]/[a-zA-Z0-9._/-]{1,260}$'){throw 'F5_OWNER_WSL_CPU_DENIED'}
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $envs=@("GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY","GITHUB_ACTOR=$env:GITHUB_ACTOR",
                  "GITHUB_EVENT_NAME=$env:GITHUB_EVENT_NAME","GITHUB_REF=$env:GITHUB_REF",
                  "GITHUB_WORKFLOW_REF=$env:GITHUB_WORKFLOW_REF",
                  "GITHUB_RUN_NUMBER=$env:GITHUB_RUN_NUMBER","GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
                  "GITHUB_RUN_ID=$env:GITHUB_RUN_ID","GITHUB_SHA=$env:GITHUB_SHA",
                  "RUNNER_NAME=$env:RUNNER_NAME","RUNNER_OS=$env:RUNNER_OS",
                  "RUNNER_ARCH=$env:RUNNER_ARCH",'P85MR_F5_NATIVE_FITCAL_ONLY=1',
                  'CUDA_VISIBLE_DEVICES=-1','PYTHONDONTWRITEBYTECODE=1','PYTHONHASHSEED=0')
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=30s 9000s /usr/bin/env @envs $py -I -B "$linux/experiments/p85mr_f5_native_vs_controls.py" --f3 "$linux/local_runs/p85mr_f5_source_F3.zip" --f4 "$linux/local_runs/p85mr_f5_controls_F4.zip" --receipt "$linux/local_runs/p85mr_f5_native_result.json"
          if($LASTEXITCODE -ne 0){throw 'F5_NATIVE_RUN_OR_SOURCE_ADMISSION_FAIL_NO_REPLAY'}
          Write-Output 'F5_NATIVE_CAL_DEV_EVALUATED_NO_OOD'

      - name: Preserve only GitHub source identity, trained original weights and numerical DEV receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p85mr-f5-native-fitcal-${{ github.sha }}-${{ github.run_id }}
          path: |
            p85mr-f5/local_runs/p85mr_f5_windows_cpu.json
            p85mr-f5/local_runs/p85mr_f5_wsl_cpu.json
            p85mr-f5/local_runs/p85mr_f5_native_result.json
            p85mr-f5/local_runs/p85mr_f5_native_models/*.npz
          retention-days: 30
          if-no-files-found: warn
