# G7-S20: partially observable two-state physics and frozen four-phase A→B→C→A retention.
name: G7-S20 hidden-state multicycle tokenless memory

on:
  push:
    branches:
      - engineering/g7-s20-hidden-state-multicycle-20261107
    paths:
      - .github/workflows/g7-s20-hidden-state-multicycle.yml

permissions:
  contents: read

concurrency:
  group: ttt-g7-s20-exact-one-use-hidden-state-multicycle
  cancel-in-progress: false

jobs:
  bounded-hidden-state-multicycle:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/g7-s20-hidden-state-multicycle-20261107' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 8
    steps:
      - name: Exact candidate isolated checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: g7-s20-isolated
          fetch-depth: 7
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Verify exact scope, frozen protocol, no-root CPU execution
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $r = [ordered]@{
            schema = 'ttt-hybrid.g7-s20.one-use-exact-custody.v1'
            candidate_sha = $env:GITHUB_SHA
            predecessor_sha = '65308a66956b2bca70c48600fd5a879b5b22d388'
            predecessor_s19_science_run = 42398803072
            status = 'BLOCKED_NOT_STARTED'
            source_custody = 'UNVERIFIED'
            frozen_study = 'UNVERIFIED'
            launcher_admission = 'NOT_RUN'
            science = 'NOT_RUN'
            no_cuda = $true
            no_install = $true
            independent_qualification = 'NOT_RUN'
            deployment = 'NOT_AUTHORIZED'
          }
          $checkout = Join-Path $env:GITHUB_WORKSPACE 'g7-s20-isolated'
          $out = Join-Path $checkout 'local_runs'
          try {
            if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
                $env:GITHUB_REF -cne 'refs/heads/engineering/g7-s20-hidden-state-multicycle-20261107' -or
                $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
                $env:GITHUB_EVENT_NAME -cne 'push' -or
                $env:GITHUB_RUN_NUMBER -cne '1' -or
                $env:GITHUB_RUN_ATTEMPT -cne '1' -or
                $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
                $env:RUNNER_OS -cne 'Windows') {
              $r.status = 'BLOCKED_RUNNER_OR_SCOPE'
              throw 'G7_S20_SCOPE'
            }
            $base = '65308a66956b2bca70c48600fd5a879b5b22d388'
            $head = (& git -C $checkout rev-parse HEAD | Out-String).Trim()
            $hc = $LASTEXITCODE
            $parent = (& git -C $checkout rev-parse 'HEAD^' | Out-String).Trim()
            $pc = $LASTEXITCODE
            $ancestor = (& git -C $checkout rev-parse 'HEAD~4' | Out-String).Trim()
            $ac = $LASTEXITCODE
            $dirty = (& git -C $checkout status --porcelain --untracked-files=all | Out-String).Trim()
            $dc = $LASTEXITCODE
            $changed = @(& git -C $checkout diff --name-only $base HEAD)
            $cc = $LASTEXITCODE
            $scope = @(
              'experiments/g7_s20_frozen_hidden_multicycle.json',
              'scripts/g7_s20_hidden_multicycle.py',
              'scripts/g7_s20_cpu_launcher.py',
              '.github/workflows/g7-s20-hidden-state-multicycle.yml'
            )
            if ($hc -ne 0 -or $pc -ne 0 -or $ac -ne 0 -or $dc -ne 0 -or
                $cc -ne 0 -or $head -cne $env:GITHUB_SHA -or
                $parent -cne 'ed002691a3564771a91e700cd258a7e6ed9cefdb' -or
                $ancestor -cne $base -or $dirty -or
                $changed.Count -ne 4) {
              $r.status = 'BLOCKED_EXACT_SOURCE_SHA'
              throw 'G7_S20_SOURCE_CUSTODY'
            }
            foreach ($path in $scope) {
              if ($changed -notcontains $path) {
                $r.status = 'BLOCKED_UNEXPECTED_SOURCE_SCOPE'
                throw 'G7_S20_SOURCE_SCOPE'
              }
            }
            $r.source_custody = 'PASS_S19_ANCESTOR_EXACT_FOUR_FROZEN_FILES'
            $protocol = Get-Content -LiteralPath (Join-Path $checkout 'experiments/g7_s20_frozen_hidden_multicycle.json') -Raw | ConvertFrom-Json
            if ($protocol.schema -cne 'ttt-hybrid.g7-s20.hidden-state-multicycle.v1' -or
                $protocol.predecessor.s19_sha -cne $base -or
                $protocol.predecessor.s19_run -ne 42398803072 -or
                $protocol.training.seeds.Count -ne 3 -or
                $protocol.training.total_updates_per_trained_arm_per_seed -ne 528 -or
                $protocol.training.phase_A.steps -ne 240 -or
                $protocol.training.phase_B.steps -ne 96 -or
                $protocol.training.phase_C.steps -ne 96 -or
                $protocol.training.phase_D.steps -ne 96 -or
                $protocol.evaluation.heldout_seeds.source.Count -ne 3 -or
                $protocol.evaluation.heldout_seeds.sine.Count -ne 3 -or
                $protocol.evaluation.heldout_seeds.rational.Count -ne 3 -or
                $protocol.calibration.seeds.Count -ne 3 -or
                $protocol.authority.cpu_only -cne $true -or
                $protocol.authority.no_install -cne $true -or
                $protocol.frozen_thresholds.wall_seconds_max -ne 240) {
              $r.status = 'BLOCKED_FROZEN_PROTOCOL'
              throw 'G7_S20_FROZEN_PRECOMMIT'
            }
            $r.frozen_study = 'PASS_PRECOMMITTED_BEFORE_EXECUTION'
            $linuxRoot = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$checkout" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $linuxRoot -notmatch '^/mnt/[a-z]/') {
              $r.status = 'BLOCKED_WSL_CHECKOUT_PATH'
              throw 'G7_S20_WSL_PATH'
            }
            $uid = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $uid -cne '1000') {
              $r.status = 'BLOCKED_NOT_NORMAL_USER'
              throw 'G7_S20_UID'
            }
            $raw = @(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=12s 300s /usr/bin/python3 -I -B "$linuxRoot/scripts/g7_s20_cpu_launcher.py" --expected-sha "$env:GITHUB_SHA")
            $rc = $LASTEXITCODE
            $admission = @($raw | Where-Object { $_ -match '^G7_S20_ADMISSION=' })
            $science = @($raw | Where-Object { $_ -match '^G7_S20_SCIENCE=' })
            if ($admission.Count -ne 1 -or $science.Count -ne 1) {
              $r.status = 'BLOCKED_LAUNCHER_RECEIPT_MISSING'
              throw 'G7_S20_LAUNCHER'
            }
            $r.launcher_admission = $admission[0].Substring('G7_S20_ADMISSION='.Length)
            $r.science = $science[0].Substring('G7_S20_SCIENCE='.Length)
            if ($rc -ne 0 -or
                $r.launcher_admission -cne 'PASS_CPU_HIDDEN_STATE_FOUR_PHASE_STUDY_MEASURED' -or
                $r.science -notin @(
                  'PRELIMINARY_PARTIAL_OBSERVATION_MULTICYCLE_TRANSFER_NOT_SCIENTIFIC_PASS',
                  'PARTIAL_OBSERVATION_OR_MULTICYCLE_LEARNING_FROZEN_NULL')) {
              $r.status = 'BLOCKED_SCIENCE_OR_LAUNCHER_CONTROLS'
              throw 'G7_S20_SCIENCE'
            }
            $file = Join-Path $out 'g7_s20_hidden_multicycle_evidence.json'
            $data = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            if ($data.candidate_sha -cne $env:GITHUB_SHA -or
                $data.oracle_controls_pass -cne $true -or
                $data.source_conventional_controls_pass -cne $true -or
                $data.installed_packages_changed -cne $false -or
                $data.tokenizer_used -cne $false -or
                $data.vocabulary_used -cne $false -or
                $data.attention_used -cne $false -or
                $data.hidden_state_or_latent_coefficients_supplied_to_predictor -cne $false -or
                $data.steps_per_model_per_seed -ne 528 -or
                $data.worlds_per_model_per_seed -ne 25344 -or
                $data.all_model_cold_restores_exact -cne $true -or
                $data.untrained_kernel_and_random_controls_unchanged -cne $true -or
                $data.per_seed.Count -ne 3) {
              $r.status = 'BLOCKED_UNQUALIFIED_MEASUREMENT'
              throw 'G7_S20_MEASUREMENT_RECEIPT'
            }
            $r.status = 'PASS_FROZEN_TOKENLESS_HIDDEN_STATE_MULTICYCLE_MEASURED'
          } finally {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            $r | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'g7_s20_workflow_admission.json') -Encoding UTF8
            Write-Output ('G7_S20_RESULT=' + $r.status)
            Write-Output ('G7_S20_SCIENCE=' + $r.science)
            Write-Output ('G7_S20_CUDA=NOT_USED')
          }

      - name: Preserve frozen science and custody receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-s20-hidden-state-${{ github.sha }}
          path: |
            g7-s20-isolated/local_runs/g7_s20_workflow_admission.json
            g7-s20-isolated/local_runs/g7_s20_hidden_multicycle_evidence.json
          if-no-files-found: warn
          retention-days: 30
