# Authorized G7-R5: exactly one 16x16 CUDA smoke, no model forward or training.
# First/only main push changing this workflow is eligible.
name: G7-R5 one-time bounded native CUDA kernel
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g7-r5-single-cuda-kernel.yml"

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g7-r5-single-cuda-kernel
  cancel-in-progress: false

jobs:
  first-native-kernel:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 7
    steps:
      - name: Checkout exact main candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
      - name: Bounded single CUDA matmul with source and package custody
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_RUN_NUMBER -cne '1' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
              $env:RUNNER_OS -cne 'Windows') {
            throw 'G7_R5_ADMISSION_DENIED'
          }
          $head = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'G7_R5_SHA_DRIFT'
          }
          $dirty = (git -C $env:GITHUB_WORKSPACE status --porcelain | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) {
            throw 'G7_R5_DIRTY_CHECKOUT'
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'local_runs') | Out-Null
          $linuxRoot = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $linuxRoot -notmatch '^/mnt/[a-z]/') {
            throw 'G7_R5_WSL_PATH_UNAVAILABLE'
          }
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 240s /usr/bin/python3 -I -B "$linuxRoot/scripts/g7_r5_oneshot.py" --expected-sha "$env:GITHUB_SHA" --receipt "$linuxRoot/local_runs/g7_r5_kernel.json"
          if ($LASTEXITCODE -ne 0) { throw 'G7_R5_KERNEL_GATE_NOT_PASS_SEE_RECEIPT' }
          Write-Output 'G7_R5_SINGLE_NATIVE_CUDA_SMOKE_ACCEPTED'
      - name: Preserve immutable sanitized kernel receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-r5-kernel-${{ github.sha }}-${{ github.run_id }}
          path: local_runs/g7_r5_kernel.json
          if-no-files-found: warn
          retention-days: 30
