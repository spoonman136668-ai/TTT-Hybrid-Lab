# Owner-authorized, one-time read-only recovery of G7-R6 receipts.
# No checkout: touching/cleaning the old TTT workspace could destroy the evidence.
# No WSL, CUDA, Python environment, model, package installation, or other project access.
name: G7-R7 one-shot read-only G3 error custody
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g7-r7-single-readonly-receipt.yml"

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g7-r7-original-receipt-custody
  cancel-in-progress: false

jobs:
  recover-original:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 4
    steps:
      - name: Read only original receipt, verify SHA-256 links, emit sanitized exception category
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $original = 'd028badf39f7e3392adc24329be4152cdcdc00cd'
          $nativeDigest = '4d6cd2d716a4ea417d2e5a424e6878c9bad4ab93a0e7e5351ceb0c4158700f29'
          $pinsDigest = '44f3e76d2d06ee879fa3222dd3921c7a1f8e08be579b96e03b7545e388a7b768'
          $result = [ordered]@{
            schema = 'ttt-hybrid.g7-r7.original-error-custody.v1'
            original_run_id = 42281970624
            original_sha = $original
            recorded_native_sha256 = $nativeDigest
            status = 'BLOCKED_UNVERIFIED'
            original_source_bound = $false
            native_digest_matched = $false
            g3_digest_matched = $false
            g3_status = 'UNVERIFIED'
            exception_type = 'UNVERIFIED'
            error_signature = 'UNVERIFIED'
            traceback_module = 'UNVERIFIED'
            raw_error_message = 'NOT_EXPORTED'
            raw_traceback = 'NOT_EXPORTED'
            wsl = 'NOT_STARTED'
            cuda = 'NOT_STARTED'
            training = 'NOT_RUN'
            deployment = 'NOT_AUTHORIZED'
            scientific = 'UNVERIFIED'
          }
          try {
            if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
                $env:GITHUB_REF -cne 'refs/heads/main' -or
                $env:GITHUB_EVENT_NAME -cne 'push' -or
                $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
                $env:GITHUB_RUN_NUMBER -cne '1' -or
                $env:GITHUB_RUN_ATTEMPT -cne '1' -or
                $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
                $env:RUNNER_OS -cne 'Windows') {
              $result.status = 'BLOCKED_WRONG_EXECUTION_CONTEXT'
              throw 'BLOCKED'
            }
            # Do not checkout here. This is the original runner's existing working tree.
            $project = $env:GITHUB_WORKSPACE
            if (-not $project -or -not (Test-Path -LiteralPath (Join-Path $project '.git'))) {
              $result.status = 'BLOCKED_ORIGINAL_WORKTREE_ABSENT'
              throw 'BLOCKED'
            }
            $head = (& git -C $project rev-parse HEAD | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -cne $original) {
              $result.status = 'BLOCKED_ORIGINAL_CHECKOUT_REPLACED'
              throw 'BLOCKED'
            }
            $result.original_source_bound = $true
            $nativePath = Join-Path $project 'local_runs\g7_r6_native_internal.json'
            $g3Path = Join-Path $project 'local_runs\g7_native_gate3_subreceipt.json'
            foreach ($path in @($nativePath, $g3Path)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                $result.status = 'BLOCKED_ORIGINAL_RECEIPTS_NOT_FOUND'
                throw 'BLOCKED'
              }
              $f = Get-Item -LiteralPath $path -Force
              if ($f.Length -le 0 -or $f.Length -gt 262144 -or $f.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
                $result.status = 'BLOCKED_ORIGINAL_RECEIPT_UNSAFE'
                throw 'BLOCKED'
              }
            }
            $observedNative = (Get-FileHash -LiteralPath $nativePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($observedNative -cne $nativeDigest) {
              $result.status = 'BLOCKED_NATIVE_DIGEST_MISMATCH'
              throw 'BLOCKED'
            }
            $result.native_digest_matched = $true
            $native = Get-Content -LiteralPath $nativePath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($native.project_sha -cne $original -or
                $native.mode -cne 'AUTHENTIC_FORWARD_ONLY' -or
                $native.native_gate3_status -cne 'FAIL_AUTHENTIC_GPU_INTEGRATION' -or
                $native.status -cne 'FAIL_NATIVE_GATE3_INTEGRATION' -or
                $native.source_pins_sha256 -cne $pinsDigest) {
              $result.status = 'BLOCKED_NATIVE_RECEIPT_IDENTITY_MISMATCH'
              throw 'BLOCKED'
            }
            $observedG3 = (Get-FileHash -LiteralPath $g3Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not $native.native_gate3_receipt_sha256 -or
                $native.native_gate3_receipt_sha256.ToLowerInvariant() -cne $observedG3) {
              $result.status = 'BLOCKED_G3_DIGEST_MISMATCH'
              throw 'BLOCKED'
            }
            $result.g3_digest_matched = $true
            $g3 = Get-Content -LiteralPath $g3Path -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($g3.status -cne 'FAIL_AUTHENTIC_GPU_INTEGRATION' -or
                $g3.mode -cne 'FORWARD_ONLY_NO_GRAD' -or
                $g3.source_pins_sha256 -cne $pinsDigest) {
              $result.status = 'BLOCKED_G3_RECEIPT_IDENTITY_MISMATCH'
              throw 'BLOCKED'
            }
            $result.g3_status = 'FAIL_AUTHENTIC_GPU_INTEGRATION'
            $allowedTypes = @('RuntimeError', 'AttributeError', 'TypeError',
              'ValueError', 'AssertionError', 'ImportError', 'ModuleNotFoundError',
              'NotImplementedError', 'OSError', 'OutOfMemoryError',
              'CompilationError', 'TritonError', 'UnboundLocalError')
            if ($allowedTypes -ccontains [string]$g3.error_type) {
              $result.exception_type = [string]$g3.error_type
            } else {
              $result.exception_type = 'OTHER_EXCEPTION'
            }
            # Raw error text and traceback are processed in memory only and never uploaded.
            $trace = (@($g3.traceback_tail) -join "`n")
            $detail = ([string]$g3.error_message) + "`n" + $trace
            if ($detail -match 'causal_conv1d_fwd_function' -and $detail -match "NoneType.*callable|not callable") {
              $result.error_signature = 'FUSED_CAUSAL_CONV1D_NOT_CALLABLE'
            } elseif ($detail -match 'no kernel image|invalid device function|unsupported gpu architecture') {
              $result.error_signature = 'CUDA_ARCH_OR_KERNEL_UNSUPPORTED'
            } elseif ($detail -match 'out of memory|CUDA error: out of memory') {
              $result.error_signature = 'CUDA_OUT_OF_MEMORY'
            } elseif ($detail -match 'Triton|triton') {
              $result.error_signature = 'TRITON_OR_COMPILED_KERNEL_EXCEPTION'
            } elseif ($detail -match 'shape|dimension|size mismatch|reshape') {
              $result.error_signature = 'POSSIBLE_SHAPE_OR_INTERFACE_MISMATCH'
            } else {
              $result.error_signature = 'UNCLASSIFIED_EXCEPTION'
            }
            $allowModules = @('authentic_hybrid.py', 'run_gate3.py',
              'mamba2.py', 'ssd_combined.py', 'layernorm_gated.py',
              'ttt.py', 'g7_cuda_qualification.py', 'causal_conv1d.py')
            foreach ($line in @($g3.traceback_tail)) {
              if ([string]$line -match '(?i)[\\/]([a-z0-9_]+\.py)') {
                $m = $Matches[1].ToLowerInvariant()
                if ($allowModules -ccontains $m) { $result.traceback_module = $m }
              }
            }
            $result.status = 'PASS_ORIGINAL_ERROR_CUSTODY_ONLY'
          } catch {
            if ($result.status -eq 'BLOCKED_UNVERIFIED') {
              $result.status = 'FAIL_READONLY_DIAGNOSTIC_' + $_.Exception.GetType().Name
            }
          } finally {
            # Artifact goes only into runner temporary output, never into the old repo.
            $out = Join-Path $env:RUNNER_TEMP 'g7_r7_readonly_diagnostic.json'
            $result | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $out -Encoding UTF8
            Write-Output ('G7_R7_STATUS=' + $result.status)
            Write-Output ('G7_R7_ERROR_TYPE=' + $result.exception_type)
            Write-Output ('G7_R7_ERROR_SIGNATURE=' + $result.error_signature)
          }
          if ($result.status -cne 'PASS_ORIGINAL_ERROR_CUSTODY_ONLY') { exit 2 }
      - name: Preserve sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-r7-original-error-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/g7_r7_readonly_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
