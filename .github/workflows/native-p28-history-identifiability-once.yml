# P28 original factual source historical identifiability once: NO external action downloads.
# Same original TTT owner, scientific first-use denied, independent P26 and P27 untouched.
name: Native P28 physical-history identifiability original owner once
on:
  push:
    branches:
      - engineering/native-p28-physical-history-identifiability-dev-20261108
    paths:
      - .github/workflows/native-p28-history-identifiability-once.yml
permissions:
  contents: read
concurrency:
  group: native-p28-history-identifiability-oneuse
  cancel-in-progress: false
jobs:
  native-exact-source-public-dev:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p28-physical-history-identifiability-dev-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 26
    env:
      GH_REPO_TOKEN: ${{ github.token }}
    steps:
      - name: Native exact-SHA Git transport, immutable source custody and original science fence
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'P28_ORIGINAL_OWNER_ONEUSE_DENIED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p28-candidate'
          if(Test-Path -LiteralPath $root){throw 'P28_ROOT_EXISTS_NO_OVERWRITE'}
          if([string]::IsNullOrWhiteSpace($env:GH_REPO_TOKEN)){throw 'P28_READONLY_GIT_TOKEN_MISSING'}
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GIT_LFS_SKIP_SMUDGE='1'
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_REPO_TOKEN"))
          $env:GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          try {
            & git clone --quiet --no-tags --single-branch --depth 160 --branch engineering/native-p28-physical-history-identifiability-dev-20261108 "https://github.com/$env:GITHUB_REPOSITORY.git" "$root"
            if($LASTEXITCODE -ne 0){throw 'P28_NATIVE_READONLY_GIT_CLONE_FAILED'}
          } finally {
            Remove-Item Env:\GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:\GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:\GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
            Remove-Variable auth -ErrorAction SilentlyContinue
          }
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'P28_EXACT_CANDIDATE_SHA_NOT_CHECKED_OUT'}
          & git -C $root merge-base --is-ancestor '5a1eb9569aa7e44278a57d196f6c2a8c2c6f7c0d' HEAD
          if($LASTEXITCODE -ne 0){throw 'P28_ORIGINAL_P27_QUALIFIED_SOURCE_NOT_ANCESTOR'}
          & git -C $root merge-base --is-ancestor '2b7f388c285a56b1c4dc9ec31dd50b51c0d8843e' HEAD
          if($LASTEXITCODE -ne 0){throw 'P28_PROSPECTIVE_FROZEN_IDENTIFIABILITY_NOT_ANCESTOR'}
          $m=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p28_physical_history_identifiability_frozen.json') -Raw | ConvertFrom-Json
          if($m.schema -cne 'ttt-hybrid.native-p28.physical-history-identifiability-frozen.v1' -or $m.source.no_protected_scientific_first_use -ne $true -or $m.parent.sha -cne '5a1eb9569aa7e44278a57d196f6c2a8c2c6f7c0d' -or $m.state -cne 'FROZEN_BEFORE_NEW_SOURCE_USE_OR_IMPLEMENTATION' -or @($m.training.initialization_seeds).Count -ne 3 -or @($m.public_source.heldout_lengths).Count -ne 2 -or $m.training.epochs -ne 64 -or $m.public_source.fresh_training_seed_range[0] -ne 122000 -or $m.public_source.fresh_heldout_seed_range[0] -ne 123000){throw 'P28_PREDECLARED_HISTORY_OR_FIRST_USE_FENCE_FAILED'}
          $protected=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'scripts/native_p18_real_cartpole_factual_dev.py'='0c5c0079614624d1264e477ea90b483cbe63d586';
            'scripts/native_p20_reward_only_ppo_dev.py'='cd9507b3cd86bca0d1507b1e234dcaaf5919e8f4';
            'scripts/native_p25_paired_action_consequence_dev.py'='6c07b1738c8c50f2ca9d8e13eb0ebee01424f45e';
            'tests/test_native_p25_paired_action_consequence_dev.py'='97df4ad8c0543a1a7e60eb98d69dcff9c8c9b704';
            'experiments/native_p25_paired_action_consequence_frozen.json'='05af59eb4b0d980a18c0621c94e8265b3fe9d52f';
            'experiments/native_p25r1_json_custody_repair_frozen.json'='8a4bdfbc3af2f8b4ff9d2894d9933a734d5783f3';
            'experiments/native_p27_state_dependent_effect_frozen.json'='0daeb55af2c80b7fcda4fd451f6ef0ff65a556e6';
            'scripts/native_p27_state_dependent_effect_dev.py'='16a87a9a18be588991377a9bed1dccc298edfba7';
            'tests/test_native_p27_state_dependent_effect_dev.py'='c28c1996836d8daea710d3150ce16e35cc0b4efe';
            'experiments/native_p28_physical_history_identifiability_frozen.json'='986d4f89c219e95f653e6abd160b82eb4543fb02';
            'scripts/native_p28_physical_history_identifiability_dev.py'='156185a18b3b8aee23991ee01fd67ea6679c3fe4';
            'tests/test_native_p28_physical_history_identifiability_dev.py'='ab9eb99883fe92b5b482e38250d10fd39d59e0f6'
          }
          foreach($name in $protected.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $protected[$name]){throw "P28_SOURCE_BLOB_CHANGED:$name"}
          }
          $source=@{
            'native-p25-s29-owner'='30c27ca4865e16b7574ee2b562879108db2b3796';
            'native-p25-mit-gym'='17eff00220d210beda933f78b0e52850022b0690';
            'native-p25-bsd3-cloudpickle'='ff54d93221082d4ce22630ecdb8fbbccc60f3b62'
          }
          foreach($name in $source.Keys){
            $dir=Join-Path $env:GITHUB_WORKSPACE $name
            if(-not(Test-Path -LiteralPath $dir -PathType Container)){throw "P28_ORIGINAL_READONLY_SOURCE_MISSING:$name"}
            $sha=(& git -C $dir rev-parse HEAD|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $source[$name]){throw "P28_ORIGINAL_SOURCE_SHA_MISMATCH:$name"}
            $dirty=(& git -C $dir status --porcelain --untracked-files=all|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $dirty){throw "P28_ORIGINAL_SOURCE_DIRTY:$name"}
          }
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'P28_CANDIDATE_DIRTY_BEFORE_TEST'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P28_QUALIFIED_CPU_INTERPRETER_MISSING'}
          $versions=@(& $py -I -B -c 'import torch,pytest,numpy;print(torch.__version__);print(pytest.__version__);print(numpy.__version__)')
          if($LASTEXITCODE -ne 0 -or $versions.Count -ne 3 -or $versions[0] -cne '2.5.1+cpu' -or $versions[1] -cne '8.3.4' -or $versions[2] -cne '1.26.4'){throw 'P28_QUALIFIED_CPU_TOOLCHAIN_DRIFT'}
          Write-Output "P28_ORIGINAL_OWNER_SOURCE_AND_TRANSPORT=PASS SHA=$head PRIOR_P27_QUALIFIED_P26_UNCHANGED"
      - name: Mandatory full Windows final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p28-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:OMP_NUM_THREADS='1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p28_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P28_WINDOWS_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p28_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P28_WINDOWS_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P28_WINDOWS_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: Mandatory full Ubuntu WSL final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'P28_ORIGINAL_UBUNTU_WSL_OWNER_DRIFT'}
          $root="$lp/native-p28-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p28_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P28_UBUNTU_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p28-candidate\local_runs\native_p28_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P28_UBUNTU_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P28_UBUNTU_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: One public-source history identifiability and oracle ceiling DEV assay
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $who -or -not $lp){throw 'P28_SOURCE_WSL_NOT_AVAILABLE'}
          $root="$lp/native-p28-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 710s /usr/bin/env 'NATIVE_P20_DEV_ONLY=1' 'NATIVE_P28_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/native_p28_physical_history_identifiability_dev.py" --s29-root "$lp/native-p25-s29-owner" --source-root "$lp/native-p25-mit-gym" --cloudpickle-root "$lp/native-p25-bsd3-cloudpickle" --receipt "$root/local_runs/native_p28_history_identifiability.json"
          if($LASTEXITCODE -ne 0){throw 'P28_GENUINE_FACTUAL_ACTION_ASSAY_FAILED'}
          $rp=Join-Path $env:GITHUB_WORKSPACE 'native-p28-candidate\local_runs\native_p28_history_identifiability.json'
          $p=Get-Content -LiteralPath $rp -Raw|ConvertFrom-Json
          if($p.engineering -cne 'PASS_SOURCE_DEV_ONLY' -or $p.scientific_first_use -cne 'NOT_RUN' -or @($p.records).Count -ne 3 -or $p.source_custody.training.valid_pairs_total -lt 850 -or $p.source_custody.evaluation.valid_pairs_total -lt 340 -or $p.eligible_architecture_superiority_not_claimed -ne $true){throw 'P28_REAL_HISTORY_IDENTIFIABILITY_SOURCE_OR_SCIENCE_FENCE_FAILED'}
          $checksum=(Get-FileHash -Algorithm SHA256 -LiteralPath $rp).Hash.ToLowerInvariant()
          $summary=@()
          foreach($rec in @($p.records)){
            $byLength=@{}
            foreach($length in @('0.36','0.62')){
              $s=$rec.heldout_physics_source_scores.PSObject.Properties[$length].Value
              $byLength[$length]=@{
                effect_history_MLP_mse=$s.history_effect_MLP.mse
                effect_shuffled_history_MLP_mse=$s.shuffled_history_effect_MLP.mse
                effect_visible_trained_ridge_mse=$s.trained_visible_finite_difference_ridge.mse
                effect_source_length_oracle_diagnostic_mse=$s.privileged_source_length_oracle_diagnostic.mse
                effect_train_constant_mse=$s.train_fitted_constant_effect.mse
                historical_length_estimator_MAE=$s.history_length_MLP.source_length_MAE
                historical_length_ridge_MAE=$s.trained_visible_ridge_length_MAE
                train_constant_length_MAE=$s.train_constant_length_MAE
                true_factual_action_effect_mean=$s.actual_true_effect_mean
              }
            }
            $summary+=@{
              model_seed=$rec.seed
              heldout_new_physical_lengths=$byLength
              frozen_identifiability_rules=$rec.frozen_identifiability_rules
              conventional_visible_ridge_superiority=$rec.trained_conventional_eligible_vs_MLP_by_length
            }
          }
          Write-Output "P28_COMPLETE_REAL_SOURCE_RECEIPT_SHA256=$checksum"
          $report=@{
            status=$p.engineering
            frozen_history_identifiability=$p.frozen_public_identifiability_mechanism_all_seeds
            privileged_source_oracle_upper_support=$p.source_oracle_upper_diagnostic_support
            actual_physical_effect_heterogeneity=$p.physical_heterogeneity_squared_mean_shift
            scientific_first_use=$p.scientific_first_use
            real_train_sister_pairs=$p.source_custody.training.valid_pairs_total
            real_eval_sister_pairs=$p.source_custody.evaluation.valid_pairs_total
            actual_train_source_actions=$p.source_custody.training.original_real_environment_actions
            actual_eval_source_actions=$p.source_custody.evaluation.original_real_environment_actions
            training_real_factual_source_SHA256=$p.source_custody.training.all_real_sister_world_events_sha256
            wall_seconds=$p.whole_factual_process_wall_seconds
            seeds=$summary
          }
          Write-Output ("P28_FINAL_OBSERVABILITY_AND_EFFECT_SUMMARY_JSON="+($report|ConvertTo-Json -Compress -Depth 12))
          Write-Output "P28_EXACT_SOURCE_ENGINEERING_DEV=PASS HISTORY_IDENTIFIABLE=$($p.frozen_public_identifiability_mechanism_all_seeds) SOURCE_ORACLE_DIAGNOSTIC=$($p.source_oracle_upper_diagnostic_support)"
      - name: Preserve full local P25R2 factual receipts and SHA256 without external Actions dependency
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p28-candidate'
          if(Test-Path -LiteralPath (Join-Path $root 'local_runs')){
            $dir=Join-Path $root 'local_runs'
            $files=@(Get-ChildItem -LiteralPath $dir -File -Filter 'native_p28_*.json')
            if($files.Count -gt 0){
              $zip=Join-Path $dir 'native_p28_owner_receipts.zip'
              if(-not(Test-Path -LiteralPath $zip)){
                Compress-Archive -LiteralPath @($files|ForEach-Object{$_.FullName}) -DestinationPath $zip -CompressionLevel Optimal
              }
              if(Test-Path -LiteralPath $zip){
                $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
                $bytes=(Get-Item -LiteralPath $zip).Length
                Write-Output "P28_LOCAL_RECEIPTS_ZIP=SHA256:$hash BYTES:$bytes FILES:$($files.Count) ROOT:$dir"
              }
            }else{Write-Output 'P28_ORIGINAL_RUN_ENTERED_NO_NATIVE_RECEIPTS'}
          }else{Write-Output 'P28_NO_SOURCE_STEPS_EXECUTED_NO_RECEIPTS'}
