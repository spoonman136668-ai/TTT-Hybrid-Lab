# P7 synthetic offline integrity admission only. No real key, backup, model, GPU, or scientific use.
name: Native P7 offline backup custody one-use
on:
  push:
    branches: [engineering/native-offline-backup-custody-p7-20261108]
    paths: [.github/workflows/native-p7-offline-backup-once.yml]
permissions:
  contents: read
concurrency:
  group: hybrid-native-p7-offline-custody-oneuse
  cancel-in-progress: false
jobs:
  windows-and-wsl:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-offline-backup-custody-p7-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p7-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 190
      - name: Lock P6 ancestor and P7 source blobs; verify no science first use
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'BLOCKED_P7_OWNER_ONEUSE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_P7_SOURCE_SHA'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_P7_DIRTY'}
          & git -C $root merge-base --is-ancestor 'f1c2a0b069972c5b1caa3b0b84d02674e8978dab' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P7_P6_ANCESTOR'}
          $blobs=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_training_checkpoint.py'='57728c0fc164cf5954449cec86f31b9c0e9d16e8';
            'native_checkpoint_recovery.py'='01542adb60e64a393aed074dd99e82ffee3e666a';
            'native_capability_registry.py'='b81f36caa615dcc3f679de3b401fc1c10237dfe9';
            'scripts/native_p6_artifact_recovery.py'='c5c1c2c06e43326ad85b13362d1b88b58834ee76';
            'tests/test_native_p6_artifact_recovery.py'='68e53fd3dd118387371ed90f5988c324a89c3194';
            'native_backup_custody.py'='0fba8fc2f4d0b9b6197f4c18c714edda286147eb';
            'tests/test_native_backup_custody.py'='23570edb344408f02aa5e612984b40287ccf1b1e';
            'docs/OFFLINE_BACKUP_CUSTODY.md'='0f9b8f36c5004f5f7c15cdd725e4a72110191901';
            'experiments/native_p1_control_admission_preflight.json'='9de1caedb56f1248264ac37db08ec66b8265fe16'
          }
          foreach($name in $blobs.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $blobs[$name]){throw "BLOCKED_P7_SOURCE_BLOB:$name"}
          }
          $p=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p1_control_admission_preflight.json') -Raw|ConvertFrom-Json
          if($p.science.authorized -ne $false -or $p.science.data_consumed -ne $false -or @($p.science.seeds.PSObject.Properties).Count -ne 0 -or $p.engineering.model_fit_real_world -ne $false){throw 'BLOCKED_P7_SCIENCE_SCOPE'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'BLOCKED_P7_PYTHON'}
          $torch=(& $py -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          $pytest=(& $py -I -B -c 'import pytest;print(pytest.__version__)'|Out-String).Trim()
          if($torch -cne '2.5.1+cpu' -or $pytest -cne '8.3.4'){throw 'BLOCKED_P7_RUNTIME'}
          Write-Output 'NATIVE_P7_EXACT_SOURCE_AND_NONSCIENCE=PASS'
      - name: Full Windows regression and original CUDA negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\p7_windows.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P7_WINDOWS_FULL'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\p7_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_P7_WINDOWS_RECEIPT'}
          if($q.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 199){throw 'BLOCKED_P7_WINDOWS_MISSING_TESTS'}
          Write-Output 'NATIVE_P7_WINDOWS_FULL_AND_NEGATIVE=PASS_ENG_ONLY'
      - name: Full Ubuntu WSL regression and original CUDA negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'BLOCKED_P7_WSL_OWNER'}
          $root="$lp/native-p7-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/p7_linux.json"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P7_WSL_FULL'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate\local_runs\p7_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_P7_WSL_RECEIPT'}
          if($q.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 198){throw 'BLOCKED_P7_WSL_MISSING_TESTS'}
          Write-Output 'NATIVE_P7_WSL_FULL_AND_NEGATIVE=PASS_ENG_ONLY'
      - name: Archive exact SHA CPU engineering receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p7-backup-custody-eng-once
          path: native-p7-candidate/local_runs/p7_*.json
          retention-days: 7
          if-no-files-found: warn
