name: G5 authentic TTT CPU
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-ttt-cpu:
    name: Native TTT CPU / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout exact official TTT source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: test-time-training/ttt-lm-pytorch
          ref: cd831db10c8c9a0f6340f02da5613316a8a92b67
          path: _upstream/ttt
          persist-credentials: false

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-g5.txt

      - name: Install isolated pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt -r requirements-g5.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Run actual official TTT-Linear engineering probe
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: ${{ github.workspace }}/_upstream/ttt
        run: python scripts/g5_official_ttt_cpu.py --ttt-root _upstream/ttt --receipt local_runs/g5_official_ttt_cpu.json

      - name: Upload source-bound engineering receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-g5-native-ttt-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: local_runs/g5_official_ttt_cpu.json
          if-no-files-found: warn
          retention-days: 30
