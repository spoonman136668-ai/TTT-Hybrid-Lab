# Read-only inventory only. The one-time unprotected-main exception requires
# explicit owner selection and is admissible solely on workflow run #2,
# after first workflow run 42190836409 was skipped with no job executed.
# No CUDA kernel, package installation or WSL launch.
# Route only to a TTT-Hybrid-authorized Windows self-hosted runner; do not
# target FORGE-CODEX-REMOTE or its forge-codex-isolated label.
name: G7 Windows existing-runner admission

on:
  workflow_dispatch:
    inputs:
      admission_mode:
        description: 'Select g7-readonly-once for recovery run #2; protected-main skips if unprotected'
        type: choice
        required: true
        default: protected-main
        options:
          - protected-main
          - g7-readonly-once

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g7-existing-runner-admission
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'spoonman136668-ai' && github.run_attempt == 1 && ((github.ref_protected == true && github.event.inputs.admission_mode == 'protected-main') || (github.ref_protected == false && github.event.inputs.admission_mode == 'g7-readonly-once' && github.run_number == 2)) }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 8
    steps:
      - name: Checkout exact owner-dispatched default-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
      - name: Admit existing host without WSL startup or installations
        env:
          G7_ADMISSION_MODE: ${{ github.event.inputs.admission_mode }}
          G7_REQUIRED_SCRIPT_BLOB: b35289871334b8a772fc3b16c979e3ef30313892
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\scripts\g7_existing_runner_inventory.ps1 `
            -ProjectRoot "$env:GITHUB_WORKSPACE" `
            -ExpectedSha "$env:GITHUB_SHA" `
            -ReceiptPath (Join-Path "$env:GITHUB_WORKSPACE" 'local_runs\g7_runner_inventory.json')
      - name: Retain the read-only host receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-host-inventory-${{ github.sha }}-${{ github.run_id }}
          path: local_runs/g7_runner_inventory.json
          if-no-files-found: warn
          retention-days: 30
