name: G6 TTT episodic learning screen
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-screen:
    name: Native TTT learning / Ubuntu CPU
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned official TTT source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: test-time-training/ttt-lm-pytorch
          ref: cd831db10c8c9a0f6340f02da5613316a8a92b67
          path: _upstream/ttt
          persist-credentials: false

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-g5.txt

      - name: Install isolated CPU dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt -r requirements-g5.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Execute frozen development screen
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python scripts/g6_development.py --ttt-root _upstream/ttt --receipt local_runs/g6_development.json

      - name: Preserve raw development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-g6-native-development-${{ github.event.pull_request.head.sha || github.sha }}
          path: local_runs/g6_development.json
          if-no-files-found: warn
          retention-days: 30
