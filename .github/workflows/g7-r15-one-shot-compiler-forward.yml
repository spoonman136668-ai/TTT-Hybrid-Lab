# G7-R15 owner-authorized SINGLE compiler repair + authentic GPU forward.
# New run only after exact-source 5/5 CI; no reruns, training, deployment or controllers.
name: G7-R15 single GCC repair and bounded native GPU forward
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g7-r15-one-shot-compiler-forward.yml"

permissions:
  contents: read

concurrency:
  group: ttt-g7-r15-one-shot-gcc-forward
  cancel-in-progress: false

jobs:
  repair-and-forward:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 14
    steps:
      - name: Checkout exact authorized candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
      - name: Execute one pinned WSL GCC repair and nonfused authentic forward
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_RUN_NUMBER -cne '1' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
              $env:RUNNER_OS -cne 'Windows') {
            throw 'G7_R15_ADMISSION_DENIED'
          }
          $head = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'G7_R15_SHA_DRIFT'
          }
          $dirty = (& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) {
            throw 'G7_R15_DIRTY_CHECKOUT'
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'local_runs') | Out-Null
          # Exact WSL route that already reached GPU in original G7-R9, not
          # the unqualified dynamic Get-Command call from G7-R13.
          $linuxRoot = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $linuxRoot -notmatch '^/mnt/[a-z]/') {
            throw 'G7_R15_WSL_PATH_BLOCKED'
          }
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=15s 650s /usr/bin/python3 -I -B "$linuxRoot/scripts/g7_r15_compiler_repair_forward.py" --expected-sha "$env:GITHUB_SHA" --receipt "$linuxRoot/local_runs/g7_r15_compiler_forward.json"
          if ($LASTEXITCODE -ne 0) { throw 'G7_R15_COMPILER_OR_FORWARD_NOT_QUALIFIED' }
          Write-Output 'G7_R15_ONE_SHOT_COMPILER_AND_NATIVE_FORWARD_PASS'
      - name: Retain sanitized compiler repair and original-forward receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-r15-single-compiler-forward-${{ github.sha }}-${{ github.run_id }}
          path: local_runs/g7_r15_compiler_forward.json
          if-no-files-found: warn
          retention-days: 30
