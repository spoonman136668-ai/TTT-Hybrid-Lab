# P6: synthetic checkpoint through GitHub Actions artifact storage; no real training.
name: Native P6 external artifact recovery once
on:
  push:
    branches: [engineering/native-remote-artifact-recovery-p6-20261108]
    paths: [.github/workflows/native-p6-remote-artifact-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-p6-artifact-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-remote-artifact-recovery-p6-20261108' && github.actor == 'spoonman136668-ai' && github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 10
    steps:
      - name: Checkout exact isolated producer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p6-producer
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 190
      - name: Verify source and generate synthetic checkpoint
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'BLOCKED_P6_OWNER_ONEUSE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p6-producer'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_P6_SOURCE_SHA'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_P6_DIRTY'}
          & git -C $root merge-base --is-ancestor '1b94bb4fea76d27767b597f101d8a50015c76d08' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_P5_ANCESTRY'}
          $blobs=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_training_checkpoint.py'='57728c0fc164cf5954449cec86f31b9c0e9d16e8';
            'native_checkpoint_recovery.py'='01542adb60e64a393aed074dd99e82ffee3e666a';
            'native_capability_registry.py'='b81f36caa615dcc3f679de3b401fc1c10237dfe9';
            'scripts/native_p6_artifact_recovery.py'='f39afeb2aafb467e8b0ac8cfde8ecf1b8520065f';
            'tests/test_native_p6_artifact_recovery.py'='2344cc0b95addd573cc34733eda985a6ee303fb1';
            'docs/REMOTE_ARTIFACT_RECOVERY.md'='3416d3541bab7b1997f25377de921e44aa4a63de'
          }
          foreach($name in $blobs.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $blobs[$name]){throw "BLOCKED_P6_BLOB:$name"}
          }
          $p=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p1_control_admission_preflight.json') -Raw|ConvertFrom-Json
          if($p.science.authorized -ne $false -or $p.science.data_consumed -ne $false -or @($p.science.seeds.PSObject.Properties).Count -ne 0){throw 'BLOCKED_P6_FIRST_USE'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'BLOCKED_P6_PYTHON'}
          $torch=(& $py -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          if($torch -cne '2.5.1+cpu'){throw 'BLOCKED_P6_TORCH'}
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1'
          & $py -I -B (Join-Path $root 'scripts\native_p6_artifact_recovery.py') produce --directory (Join-Path $root 'local_runs\p6_upload') --source-sha $env:GITHUB_SHA --receipt (Join-Path $root 'local_runs\p6_produce.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_PRODUCE'}
          $r=Get-Content -LiteralPath (Join-Path $root 'local_runs\p6_produce.json') -Raw|ConvertFrom-Json
          if($r.status -cne 'SYNTHETIC_REMOTE_UPLOAD_CANDIDATE' -or $r.files -ne 5 -or $r.scientific_first_use -ne $false -or $r.training_activated -ne $false){throw 'BLOCKED_P6_PRODUCER_RECEIPT'}
          Write-Output 'NATIVE_P6_PRODUCER_SOURCE_AND_CHECKPOINT=PASS_DEV_ONLY'
      - name: Upload five nonsecret checkpoint files to GitHub artifact storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p6-synthetic-remote-${{ github.run_id }}
          path: native-p6-producer/local_runs/p6_upload/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Archive producer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p6-producer-receipt-${{ github.run_id }}
          path: native-p6-producer/local_runs/p6_produce.json
          retention-days: 7
          if-no-files-found: warn
  restore:
    needs: publish
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-remote-artifact-recovery-p6-20261108' && github.actor == 'spoonman136668-ai' && github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout exact consumer source in separate root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p6-consumer
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 190
      - name: Download specific run-scoped remote artifact into fresh staging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-p6-synthetic-remote-${{ github.run_id }}
          path: native-p6-consumer/local_runs/p6_download
      - name: Confirm fresh checkout and remote artifact without local producer
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'BLOCKED_P6_CONSUMER_OWNER'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p6-consumer'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_P6_CONSUMER_SHA'}
          & git -C $root merge-base --is-ancestor '1b94bb4fea76d27767b597f101d8a50015c76d08' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_CONSUMER_ANCESTOR'}
          if(Test-Path -LiteralPath (Join-Path $root 'local_runs\p6_upload')){throw 'BLOCKED_P6_LOCAL_PRODUCER_PRESENT'}
          if(-not(Test-Path -LiteralPath (Join-Path $root 'local_runs\p6_download\metadata.json') -PathType Leaf)){throw 'BLOCKED_P6_DOWNLOADED_METADATA_MISSING'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_P6_CONSUMER_DIRTY'}
          Write-Output 'NATIVE_P6_REMOTE_ARTIFACT_PRESENT_FRESH_ROOT=PASS'
      - name: Complete Windows regression and remote artifact cold restore
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p6-consumer'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\p6_windows.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_WIN_FULL'}
          $r=Get-Content -LiteralPath (Join-Path $root 'local_runs\p6_windows.json') -Raw|ConvertFrom-Json
          if($r.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $r.revision -cne $env:GITHUB_SHA -or $r.tests.exit_code -ne 0 -or $r.negative_control.pass -ne $true){throw 'BLOCKED_P6_WIN_CI'}
          if($r.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 188){throw 'BLOCKED_P6_WIN_TESTS'}
          & $py -I -B (Join-Path $root 'scripts\native_p6_artifact_recovery.py') restore --directory (Join-Path $root 'local_runs\p6_download') --staging (Join-Path $root 'local_runs\p6_windows_staging') --source-sha $env:GITHUB_SHA --receipt (Join-Path $root 'local_runs\p6_windows_restore.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_WIN_REMOTE_RESTORE'}
          $c=Get-Content -LiteralPath (Join-Path $root 'local_runs\p6_windows_restore.json') -Raw|ConvertFrom-Json
          if($c.status -cne 'PASS_REMOTE_ARTIFACT_COLD_RESTORE_DEV' -or $c.objects_verified -ne 4 -or $c.training_activated -ne $false -or $c.model_promoted -ne $false){throw 'BLOCKED_P6_WIN_REMOTE_RECEIPT'}
          Write-Output 'NATIVE_P6_WINDOWS_FULL_REMOTE_RECOVERY=PASS_DEV_ONLY'
      - name: Complete WSL regression and independent cold restore from downloaded artifact
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'BLOCKED_P6_WSL_OWNER'}
          $root="$lp/native-p6-consumer"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/p6_linux.json"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_WSL_FULL'}
          $r=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p6-consumer\local_runs\p6_linux.json') -Raw|ConvertFrom-Json
          if($r.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $r.revision -cne $env:GITHUB_SHA -or $r.tests.exit_code -ne 0 -or $r.negative_control.pass -ne $true){throw 'BLOCKED_P6_WSL_CI'}
          if($r.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 187){throw 'BLOCKED_P6_WSL_TESTS'}
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' $py -I -B "$root/scripts/native_p6_artifact_recovery.py" restore --directory "$root/local_runs/p6_download" --staging "$root/local_runs/p6_linux_staging" --source-sha $env:GITHUB_SHA --receipt "$root/local_runs/p6_linux_restore.json"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P6_WSL_REMOTE_RESTORE'}
          $c=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p6-consumer\local_runs\p6_linux_restore.json') -Raw|ConvertFrom-Json
          if($c.status -cne 'PASS_REMOTE_ARTIFACT_COLD_RESTORE_DEV' -or $c.objects_verified -ne 4 -or $c.training_activated -ne $false -or $c.model_promoted -ne $false){throw 'BLOCKED_P6_WSL_REMOTE_RECEIPT'}
          Write-Output 'NATIVE_P6_WSL_FULL_REMOTE_RECOVERY=PASS_DEV_ONLY'
      - name: Archive exact SHA Windows and WSL recovery receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p6-remote-recovery-eng-receipts-${{ github.run_id }}
          path: |
            native-p6-consumer/local_runs/p6_windows.json
            native-p6-consumer/local_runs/p6_linux.json
            native-p6-consumer/local_runs/p6_windows_restore.json
            native-p6-consumer/local_runs/p6_linux_restore.json
          retention-days: 7
          if-no-files-found: warn
