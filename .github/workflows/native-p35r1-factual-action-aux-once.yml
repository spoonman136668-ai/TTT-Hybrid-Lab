      - name: Mandatory full Windows final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:OMP_NUM_THREADS='1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p35r1_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P33_WINDOWS_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p35r1_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P33_WINDOWS_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P33_WINDOWS_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: Mandatory full Ubuntu WSL final candidate regression and original negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'P33_ORIGINAL_UBUNTU_WSL_OWNER_DRIFT'}
          $root="$lp/native-p35r1-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p35r1_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P33_UBUNTU_FULL_FINAL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate\local_runs\native_p35r1_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P33_UBUNTU_NEGATIVE_OR_SHA_FAIL'}
          Write-Output 'P33_UBUNTU_FULL_AND_ORIGINAL_NEGATIVES=PASS'
      - name: One original MountainCar reward PPO factual action prediction versus shuffled action control and cold replay
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $who -or -not $lp){throw 'P35_SOURCE_WSL_NOT_AVAILABLE'}
          $root="$lp/native-p35r1-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $source="$root/scripts/native_p35_mountaincar_factual_aux_ppo_dev.py"
          $s29="$lp/native-p25-s29-owner"
          $mit="$lp/native-p25-mit-gym"
          $bsd="$lp/native-p25-bsd3-cloudpickle"
          $receipt="$root/local_runs/native_p35r1_reward.json"
          $weights="$root/local_runs/native_p35r1_weights"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 790s /usr/bin/env 'NATIVE_P20_DEV_ONLY=1' 'NATIVE_P35_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B $source --s29-root $s29 --source-root $mit --cloudpickle-root $bsd --receipt $receipt --checkpoint-dir $weights --mode train
          if($LASTEXITCODE -ne 0){throw 'P35_FROZEN_REAL_ACTUAL_SOURCE_AUX_TRIAL_FAILED'}
          $rp=Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate\local_runs\native_p35r1_reward.json'
          $p=Get-Content -LiteralPath $rp -Raw|ConvertFrom-Json
          if($p.engineering -cne 'PASS_PUBLIC_ORIGINAL_SOURCE_DEV' -or $p.protected_scientific_first_use -cne 'NOT_RUN' -or @($p.records).Count -ne 3 -or $p.real_source_training_actions -ne 884736 -or $p.real_source_optimizer_minibatches -ne 10368 -or $p.non_CartPole_action_consequence_task_executed -ne $true -or $p.no_scientific_architecture_or_FORGE_claim -ne $true){throw 'P35_REAL_ACTION_CONSEQUENCE_TRAIN_AND_SCIENCE_FENCE_FAIL'}
          foreach($rec in @($p.records)){
            $f=$rec.original_real_train_receipts.factual_action_aux_ppo
            $sh=$rec.original_real_train_receipts.shuffled_action_aux_ppo
            if($f.auxiliary_prediction_head_changed -ne $true -or $sh.auxiliary_prediction_head_changed -ne $true -or $f.auxiliary_wrong_action_fraction -ne 0 -or $sh.auxiliary_wrong_action_fraction -lt .5 -or $f.auxiliary_action_samples -ne $sh.auxiliary_action_samples -or $f.original_training_actual_source_actions -ne $sh.original_training_actual_source_actions -or $f.actual_source_optimizer_minibatches -ne $sh.actual_source_optimizer_minibatches -or $f.initial_core_actor_recurrent_critic_sha256 -cne $sh.initial_core_actor_recurrent_critic_sha256 -or $f.first_512_source_action_consequence_sha256 -cne $sh.first_512_source_action_consequence_sha256){throw 'P35_AUX_ORIGINAL_SOURCE_MATCHED_INFORMATION_NEGATIVE_CONTROL_FAIL'}
          }
          $modelFiles=@(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate\local_runs\native_p35r1_weights') -File -Filter '*.pt')
          if($modelFiles.Count -ne 18){throw 'P35_REAL_ACTION_CONSEQUENCE_CHECKPOINT_SET_INCOMPLETE'}
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 210s /usr/bin/env 'NATIVE_P20_DEV_ONLY=1' 'NATIVE_P35_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B $source --s29-root $s29 --source-root $mit --cloudpickle-root $bsd --receipt $receipt --checkpoint-dir $weights --mode cold
          if($LASTEXITCODE -ne 0){throw 'P35_FRESH_PROCESS_ACTUAL_SOURCE_COLD_FAIL'}
          $cold=Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate\local_runs\native_p35_mountaincar_cold_audit.json'
          if(-not(Test-Path -LiteralPath $cold -PathType Leaf)){throw 'P35_ORIGINAL_SOURCE_COLD_AUDIT_NOT_CREATED'}
          $audit=Get-Content -LiteralPath $cold -Raw|ConvertFrom-Json
          if($audit.status -cne 'PASS_EXACT_ACTUAL_MOUNTAINCAR_ACTION_REWARD_TRACE_REPLAY' -or $audit.cold_original_source_episodes -ne 432 -or $audit.total_cold_models -ne 18 -or $audit.no_gradient_updates -ne $true -or $audit.protected_scientific_first_use -cne 'NOT_RUN'){throw 'P35_COLD_ACTUAL_SOURCE_ACTION_PARITY_FAIL'}
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath $rp).Hash.ToLowerInvariant()
          $coldDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath $cold).Hash.ToLowerInvariant()
          $scores=@()
          foreach($rec in @($p.records)){
            $ar=@{}
            foreach($name in @('full_recurrent_ppo','factual_action_aux_ppo','shuffled_action_aux_ppo','actor_head_only_ppo','conventional_history_mlp_ppo','critic_only_actor_frozen')){
              $t=$rec.original_real_train_receipts.PSObject.Properties[$name].Value
              $ar[$name]=@{
                real_source_train_actions=$t.original_training_actual_source_actions
                optimizer_minibatches=$t.actual_source_optimizer_minibatches
                trainable_parameters=$t.trained_parameters
                source_action_consequence_sha256=$t.full_source_train_trace_sha256
                identical_first_real_source_actions_sha256=$t.first_512_source_action_consequence_sha256
                real_stochastic_training_curve=$t.original_source_stochastic_training_curve
                source_acceleration_aux_loss_mean=$t.auxiliary_prediction_loss_mean
                auxiliary_wrong_action_fraction=$t.auxiliary_wrong_action_fraction
                auxiliary_real_source_action_samples=$t.auxiliary_action_samples
              }
            }
            $scores+=@{
              seed=$rec.model_seed
              original_and_force_shift_physical_results=$rec.original_source_condition_means
              frozen_factual_vs_sham_scientific_thresholds=$rec.frozen_source_criteria_by_condition
              actual_real_source_PPO_and_aux_training=$ar
            }
          }
          Write-Output "P35_ACTUAL_SOURCE_REWARD_RECEIPT_SHA256=$digest COLD_RECEIPT_SHA256=$coldDigest"
          $report=@{
            engineering=$p.engineering
            precommitted_source_science_target=$p.factual_aux_advantage_precommitted_2_of_3_science_target
            seeds_passing=$p.factual_aux_seeds_passing_all_source_worlds
            actual_real_source_training_actions=$p.real_source_training_actions
            actual_PPO_optimizer_minibatches=$p.real_source_optimizer_minibatches
            original_source_eval_actions=$p.real_source_evaluation_actions
            fresh_process_real_source_cold_episodes=$audit.cold_original_source_episodes
            fresh_process_real_source_cold_actions=$audit.cold_original_source_actions
            original_training_and_eval_wall_seconds=$p.original_train_and_eval_wall_seconds
            seeds=$scores
          }
          Write-Output ("P35_SOURCE_FACTUAL_VS_SHAM_AUX_OUTCOME_JSON="+($report|ConvertTo-Json -Compress -Depth 12))
          Write-Output "P35_OWNER_EXACT_SOURCE_AND_COLD=PASS PROSPECTIVE_SOURCE_SCIENCE=$($p.factual_aux_advantage_precommitted_2_of_3_science_target)"
      - name: Preserve local P35 source-policy receipts and hashes without downloadable GitHub actions
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p35r1-candidate'
          if(Test-Path -LiteralPath (Join-Path $root 'local_runs')){
            $dir=Join-Path $root 'local_runs'
            $files=@(Get-ChildItem -LiteralPath $dir -File -Filter 'native_p35*.json')
            $modelDir=Join-Path $dir 'native_p35r1_weights'
            if(Test-Path -LiteralPath $modelDir){$files+=@(Get-ChildItem -LiteralPath $modelDir -File -Filter '*.pt')}
            if($files.Count -gt 0){
              $zip=Join-Path $dir 'native_p35r1_owner_receipts.zip'
              if(-not(Test-Path -LiteralPath $zip)){
                Compress-Archive -LiteralPath @($files|ForEach-Object{$_.FullName}) -DestinationPath $zip -CompressionLevel Optimal
              }
              if(Test-Path -LiteralPath $zip){
                $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
                $bytes=(Get-Item -LiteralPath $zip).Length
                Write-Output "P35_LOCAL_RECEIPTS_ZIP=SHA256:$hash BYTES:$bytes FILES:$($files.Count) ROOT:$dir"
              }
            }else{Write-Output 'P35_ORIGINAL_RUN_ENTERED_NO_NATIVE_RECEIPTS'}
          }else{Write-Output 'P35R1_NO_SOURCE_STEPS_EXECUTED_NO_RECEIPTS'}
