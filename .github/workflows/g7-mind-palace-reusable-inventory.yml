name: G7 isolated reusable validation probe
on:
  workflow_call:
    inputs:
      ttt_candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.repository == 'spoonman136668-ai/Mind-Palace' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: No execution until caller authorization
        shell: powershell
        run: Write-Output 'G7_SOURCE_VALIDATION_ONLY'
