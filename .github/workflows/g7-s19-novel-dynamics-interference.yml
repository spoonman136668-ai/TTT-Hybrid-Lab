# G7-S19: two unseen nonlinear families with frozen zero-shot transfer and sequential old-world retention.
name: G7-S19 two unfamiliar dynamics and sequential tokenless interference

on:
  push:
    branches:
      - engineering/g7-s19-novel-dynamics-interference-20261107
    paths:
      - .github/workflows/g7-s19-novel-dynamics-interference.yml

permissions:
  contents: read

concurrency:
  group: ttt-g7-s19-exact-one-use-novel-dynamics
  cancel-in-progress: false

jobs:
  bounded-novel-family-interference:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/g7-s19-novel-dynamics-interference-20261107' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 8
    steps:
      - name: Exact candidate isolated checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: g7-s19-isolated
          fetch-depth: 7
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Verify exact scope, frozen protocol, no-root CPU execution
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $r = [ordered]@{
            schema = 'ttt-hybrid.g7-s19.one-use-exact-custody.v1'
            candidate_sha = $env:GITHUB_SHA
            predecessor_sha = 'affe574f00d69abb8d816589ed12d81e716fc458'
            predecessor_s18_science_run = 42396385331
            status = 'BLOCKED_NOT_STARTED'
            source_custody = 'UNVERIFIED'
            frozen_study = 'UNVERIFIED'
            launcher_admission = 'NOT_RUN'
            science = 'NOT_RUN'
            no_cuda = $true
            no_install = $true
            independent_qualification = 'NOT_RUN'
            deployment = 'NOT_AUTHORIZED'
          }
          $checkout = Join-Path $env:GITHUB_WORKSPACE 'g7-s19-isolated'
          $out = Join-Path $checkout 'local_runs'
          try {
            if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
                $env:GITHUB_REF -cne 'refs/heads/engineering/g7-s19-novel-dynamics-interference-20261107' -or
                $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
                $env:GITHUB_EVENT_NAME -cne 'push' -or
                $env:GITHUB_RUN_NUMBER -cne '1' -or
                $env:GITHUB_RUN_ATTEMPT -cne '1' -or
                $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
                $env:RUNNER_OS -cne 'Windows') {
              $r.status = 'BLOCKED_RUNNER_OR_SCOPE'
              throw 'G7_S19_SCOPE'
            }
            $base = 'affe574f00d69abb8d816589ed12d81e716fc458'
            $head = (& git -C $checkout rev-parse HEAD | Out-String).Trim()
            $hc = $LASTEXITCODE
            $parent = (& git -C $checkout rev-parse 'HEAD^' | Out-String).Trim()
            $pc = $LASTEXITCODE
            $ancestor = (& git -C $checkout rev-parse 'HEAD~4' | Out-String).Trim()
            $ac = $LASTEXITCODE
            $dirty = (& git -C $checkout status --porcelain --untracked-files=all | Out-String).Trim()
            $dc = $LASTEXITCODE
            $changed = @(& git -C $checkout diff --name-only $base HEAD)
            $cc = $LASTEXITCODE
            $scope = @(
              'experiments/g7_s19_frozen_novel_dynamics.json',
              'scripts/g7_s19_novel_dynamics.py',
              'scripts/g7_s19_cpu_launcher.py',
              '.github/workflows/g7-s19-novel-dynamics-interference.yml'
            )
            if ($hc -ne 0 -or $pc -ne 0 -or $ac -ne 0 -or $dc -ne 0 -or
                $cc -ne 0 -or $head -cne $env:GITHUB_SHA -or
                $parent -cne '5e907e234f3e31ab37faa451bf09ac9857f2f770' -or
                $ancestor -cne $base -or $dirty -or
                $changed.Count -ne 4) {
              $r.status = 'BLOCKED_EXACT_SOURCE_SHA'
              throw 'G7_S19_SOURCE_CUSTODY'
            }
            foreach ($path in $scope) {
              if ($changed -notcontains $path) {
                $r.status = 'BLOCKED_UNEXPECTED_SOURCE_SCOPE'
                throw 'G7_S19_SOURCE_SCOPE'
              }
            }
            $r.source_custody = 'PASS_S18_ANCESTOR_EXACT_FOUR_FROZEN_FILES'
            $protocol = Get-Content -LiteralPath (Join-Path $checkout 'experiments/g7_s19_frozen_novel_dynamics.json') -Raw | ConvertFrom-Json
            if ($protocol.schema -cne 'ttt-hybrid.g7-s19.novel-dynamics-sequential-interference.v1' -or
                $protocol.predecessor.s18_exact_sha -cne $base -or
                $protocol.predecessor.s18_science_run -ne 42396385331 -or
                $protocol.frozen_training.seeds.Count -ne 3 -or
                $protocol.frozen_training.steps -ne 240 -or
                $protocol.evaluation.split_seeds.novel_sine_ood_switch.Count -ne 3 -or
                $protocol.evaluation.split_seeds.novel_rational_ood_switch.Count -ne 3 -or
                $protocol.calibration.seeds.Count -ne 3 -or
                $protocol.evaluation.sequential_interference.phase_B_updates -ne 96 -or
                $protocol.resource_authority.cpu_only -cne $true -or
                $protocol.resource_authority.no_package_install -cne $true -or
                $protocol.threshold.wall_limit_seconds -ne 240) {
              $r.status = 'BLOCKED_FROZEN_PROTOCOL'
              throw 'G7_S19_FROZEN_PRECOMMIT'
            }
            $r.frozen_study = 'PASS_PRECOMMITTED_BEFORE_EXECUTION'
            $linuxRoot = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$checkout" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $linuxRoot -notmatch '^/mnt/[a-z]/') {
              $r.status = 'BLOCKED_WSL_CHECKOUT_PATH'
              throw 'G7_S19_WSL_PATH'
            }
            $uid = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $uid -cne '1000') {
              $r.status = 'BLOCKED_NOT_NORMAL_USER'
              throw 'G7_S19_UID'
            }
            $raw = @(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=12s 300s /usr/bin/python3 -I -B "$linuxRoot/scripts/g7_s19_cpu_launcher.py" --expected-sha "$env:GITHUB_SHA")
            $rc = $LASTEXITCODE
            $admission = @($raw | Where-Object { $_ -match '^G7_S19_ADMISSION=' })
            $science = @($raw | Where-Object { $_ -match '^G7_S19_SCIENCE=' })
            if ($admission.Count -ne 1 -or $science.Count -ne 1) {
              $r.status = 'BLOCKED_LAUNCHER_RECEIPT_MISSING'
              throw 'G7_S19_LAUNCHER'
            }
            $r.launcher_admission = $admission[0].Substring('G7_S19_ADMISSION='.Length)
            $r.science = $science[0].Substring('G7_S19_SCIENCE='.Length)
            if ($rc -ne 0 -or
                $r.launcher_admission -cne 'PASS_CPU_CROSS_FAMILY_TRANSFER_AND_INTERFERENCE_MEASURED' -or
                $r.science -notin @(
                  'PRELIMINARY_CROSS_FAMILY_TOKENLESS_TRANSFER_REQUIRES_INDEPENDENT_QUALIFICATION',
                  'CROSS_FAMILY_RAW_FEATURE_TRANSFER_NULL_OR_NEGATIVE')) {
              $r.status = 'BLOCKED_SCIENCE_OR_LAUNCHER_CONTROLS'
              throw 'G7_S19_SCIENCE'
            }
            $file = Join-Path $out 'g7_s19_novel_dynamics_evidence.json'
            $data = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            if ($data.candidate_sha -cne $env:GITHUB_SHA -or
                $data.original_source_oracle_controls_pass -cne $true -or
                $data.original_source_conventional_controls_pass -cne $true -or
                $data.installed_packages_changed -cne $false -or
                $data.tokenizer_used -cne $false -or
                $data.vocabulary_used -cne $false -or
                $data.attention_used -cne $false -or
                $data.true_nonlinear_feature_formula_exposed_to_models -cne $false -or
                $data.trained_model_steps_phase_A_per_seed -ne 240 -or
                $data.trained_model_steps_phase_B_per_seed -ne 96 -or
                $data.training_worlds_per_seed_per_model -ne 16128 -or
                $data.all_trained_cold_restores_exact -cne $true -or
                $data.per_seed.Count -ne 3) {
              $r.status = 'BLOCKED_UNQUALIFIED_MEASUREMENT'
              throw 'G7_S19_MEASUREMENT_RECEIPT'
            }
            $r.status = 'PASS_FROZEN_TOKENLESS_NEW_FAMILIES_AND_INTERFERENCE_MEASURED'
          } finally {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            $r | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'g7_s19_workflow_admission.json') -Encoding UTF8
            Write-Output ('G7_S19_RESULT=' + $r.status)
            Write-Output ('G7_S19_SCIENCE=' + $r.science)
            Write-Output ('G7_S19_CUDA=NOT_USED')
          }

      - name: Preserve frozen science and custody receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-s19-novel-dynamics-${{ github.sha }}
          path: |
            g7-s19-isolated/local_runs/g7_s19_workflow_admission.json
            g7-s19-isolated/local_runs/g7_s19_novel_dynamics_evidence.json
          if-no-files-found: warn
          retention-days: 30
