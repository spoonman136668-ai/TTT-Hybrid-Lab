# P85MR_F3 EXACTLY ONE first-use FIT/CAL attempt on the existing project runner.
# Authorized operator approval, prospective route amendment and source freeze
# committed BEFORE this trigger file. No workflow_dispatch, cron, PR or rerun.
name: P85MR-F3 owner one-shot CartPoleWind FIT-CAL
on:
  push:
    branches:
      - research/p85mr-f3-repaired-fitcal-once-20261111
    paths:
      - .github/workflows/p85mr-f3-repaired-fitcal-once.yml

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-p85mr-f3-exclusive-firstuse
  cancel-in-progress: false

jobs:
  p85mr-f3:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/research/p85mr-f3-repaired-fitcal-once-20261111' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 75
    steps:
      - name: Check out exact one-shot branch candidate, no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: p85mr-f3
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          fetch-depth: 1

      - name: Checkout exact public Causal-Gymnasium source SHA, job-local only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: p85mr-upstream-f3
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          fetch-depth: 1

      - name: Read-only exact source and route identity admission
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRef='refs/heads/research/p85mr-f3-repaired-fitcal-once-20261111'
          $expectedWorkflow='spoonman136668-ai/TTT-Hybrid-Lab/.github/workflows/p85mr-f3-repaired-fitcal-once.yml@' + $expectedRef
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
              $env:GITHUB_REF -cne $expectedRef -or
              $env:GITHUB_WORKFLOW_REF -cne $expectedWorkflow -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_RUN_NUMBER -cne '1' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ARCH -cne 'X64' -or
              $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'P85MR_F3_OWNER_EXACT_ONE_SHOT_DENIED'
          }
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f3'
          $sha=(& git -C $root rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA) {
            throw 'P85MR_F3_SOURCE_SHA_DRIFT'
          }
          $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) {throw 'P85MR_F3_DIRTY_SOURCE'}
          $scope=(& git -C $root hash-object -- experiments/p85mr_fitcal_firstuse_authorization_freeze.json | Out-String).Trim()
          $route=(& git -C $root hash-object -- experiments/p85mr_fitcal_owner_route_amendment.json | Out-String).Trim()
          $protocol=(& git -C $root hash-object -- experiments/p84mr_external_science_preflight_freeze.json | Out-String).Trim()
          $trainer=(& git -C $root hash-object -- experiments/p85mr_strong_baseline_freeze.json | Out-String).Trim()
          if ($scope -cne 'cde1faee905027b4069deb329149e73d48292394' -or
              $route -cne 'afdf193a1f5a9e0f3c0f003aaea19585728a0020' -or
              $protocol -cne '9c259f7e03ecbd32f8d3e5f9bfdaef2a8860f724' -or
              $trainer -cne '85ae6d1eee3332ef55a653b678733e012cb57158') {
            throw 'P85MR_F3_FROZEN_SOURCE_OR_ROUTE_DRIFT'
          }
          $f2=(& git -C $root hash-object -- experiments/p85mr_f2_pinned_fitcal_authorization_freeze.json | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $f2 -cne 'bf7738238a52b6570530d86d30fe36fb594eb12d'){
            throw 'P85MR_F3_AUTHORIZED_SECOND_ONE_SHOT_FREEZE_DRIFT'
          }
          $up=Join-Path $env:GITHUB_WORKSPACE 'p85mr-upstream-f3'
          $upsha=(& git -C $up rev-parse HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $upsha -cne 'c94e9a4cd3641588b6b8507e71ccee5c27032bdf'){
            throw 'P85MR_F3_UPSTREAM_SHA_DRIFT'
          }
          $uporigin=(& git -C $up remote get-url origin | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uporigin -cnotin @('https://github.com/CausalAILab/Causal-Gymnasium',
                'https://github.com/CausalAILab/Causal-Gymnasium.git')){
            throw 'P85MR_F3_UPSTREAM_ORIGIN_DRIFT'
          }
          $updirty=(& git -C $up status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $updirty){throw 'P85MR_F3_DIRTY_UPSTREAM'}
          $blobs=@{
            'causal_gym/envs/cartpole_wind.py'='d65a6a31941709dc9201259d80dd4ebbcf48b4fa';
            'causal_gym/core/pch.py'='ff37780c6b791877c70583b8d5f699be7fcd8817';
            'causal_gym/core/task.py'='668262f3f5c88fa2865b08ef10bbf96b09a3b73e';
            'causal_gym/core/scm.py'='f66f2638c797cfeaf0e96d4e13c06d4fabc2c8d5'
          }
          foreach($rel in $blobs.Keys){
            $got=(& git -C $up hash-object -- $rel | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $got -cne $blobs[$rel]){
              throw ('P85MR_F3_UPSTREAM_BLOB_DRIFT:'+ $rel)
            }
          }
          $newFrozen=@{
            'experiments/p85mr_f3_repaired_fitcal_authorization_freeze.json'='92b0c9fc1b80dfcd8914928b83011f84473d9391';
            'experiments/p85mr_f3_fitcal_once.py'='4b9f5bdaacfb293ff9c665a707bfa9932d8e95b0';
            'scripts/p85mr_f3_owner_launch.ps1'='91753b95a4260b7a03d6f64da96061d8c1d27930';
            'tests/test_p85mr_f3_one_shot_contract.py'='ede47af1960abe9a9110697a0fd5101cf81f307c';
            'tests/test_p85mr_f3_launcher_contract.py'='63109277efa2ba06c52db869d1a85ea8c17038ce'
          }
          foreach($rel in $newFrozen.Keys){
            $hash=(& git -C $root hash-object -- $rel | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $hash -cne $newFrozen[$rel]){
              throw ('P85MR_F3_FROZEN_SOURCE_OR_TEST_DRIFT:'+ $rel)
            }
          }
          Write-Output 'P85MR_F3_FINAL_SOURCE_AND_PRE_EFFECT_OWNER_CUSTODY=PASS'

          Write-Output 'P85MR_F3_SOURCE_ROUTE_PREFLIGHT=PASS_NO_EXTERNAL_EFFECTS'

      - name: Full exact-head native Windows engineering regression and original negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f3'
          $python=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if (-not(Test-Path -LiteralPath $python -PathType Leaf)) {
            throw 'P85MR_F3_EXISTING_WINDOWS_PY311_UNAVAILABLE'
          }
          $receipt=Join-Path $root 'local_runs\p85mr_windows_cpu.json'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1'
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONHASHSEED='0'
          & $python -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'P85MR_F3_WINDOWS_FULL_REGRESSION_FAIL'}
          $r=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if($r.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or
             $r.revision -cne $env:GITHUB_SHA -or
             $r.checkout_identity.pass -ne $true -or
             $r.negative_control.pass -ne $true -or
             $r.tests.exit_code -ne 0) {
            throw 'P85MR_F3_WINDOWS_EXACT_SHA_OR_NEGATIVE_RECEIPT_FAIL'
          }
          Write-Output 'P85MR_F3_WINDOWS_FULL_REGRESSION=PASS_NO_SCIENCE'

      - name: Full exact-head isolated WSL CPU regression and original negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f3'
          $linuxRoot=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u $root | Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un | Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or
              $who -cnotmatch '^[A-Za-z_][A-Za-z0-9_-]{0,32}$' -or
              $linuxRoot -cnotmatch '^/mnt/[a-z]/[a-zA-Z0-9._/-]{1,260}$') {
            throw 'P85MR_F3_WSL_OWNER_UNQUALIFIED'
          }
          $python="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $receipt="$linuxRoot/local_runs/p85mr_wsl_cpu.json"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 720s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $python -I -B "$linuxRoot/scripts/qualify_cpu.py" --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'P85MR_F3_WSL_FULL_REGRESSION_FAIL'}
          $winReceipt=Join-Path $root 'local_runs\p85mr_wsl_cpu.json'
          $r=Get-Content -LiteralPath $winReceipt -Raw | ConvertFrom-Json
          if($r.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or
             $r.revision -cne $env:GITHUB_SHA -or
             $r.checkout_identity.pass -ne $true -or
             $r.negative_control.pass -ne $true -or
             $r.tests.exit_code -ne 0){
            throw 'P85MR_F3_WSL_EXACT_SHA_OR_NEGATIVE_RECEIPT_FAIL'
          }
          Write-Output 'P85MR_F3_WSL_FULL_REGRESSION=PASS_NO_SCIENCE'

      - name: One-time operator-authorized exact CartPoleWind FIT/CAL only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p85mr-f3'
          & (Join-Path $root 'scripts\p85mr_f3_owner_launch.ps1') -ProjectRoot $root -ExpectedSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {throw 'P85MR_F3_EXTERNAL_FIRSTUSE_ABORTED_NO_REPLAY'}

      - name: Preserve exact-source engineering and scientific attempt receipts, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p85mr-f3-fitcal-once-${{ github.sha }}-${{ github.run_id }}
          path: |
            p85mr-f3/local_runs/p85mr_*.json
            p85mr-f3/evidence/p85mr_fitcal_f3/ONCE/**
          retention-days: 30
          if-no-files-found: warn
