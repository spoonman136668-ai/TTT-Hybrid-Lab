          $gymSourceDir=Join-Path $env:GITHUB_WORKSPACE 'native-p25-mit-gym'
          $mountainBlob=(& git -C $gymSourceDir rev-parse 'HEAD:gymnasium/envs/classic_control/mountain_car.py' |Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $mountainBlob -cne '5e7e11518715197974e8df46a842f1bc66ccd88c'){throw 'P34_ORIGINAL_UPSTREAM_MOUNTAINCAR_SOURCE_BLOB_SHA_DRIFT'}
          $registryBlob=(& git -C $gymSourceDir rev-parse 'HEAD:gymnasium/envs/__init__.py' |Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $registryBlob -cne '84f23c4d6ebeba0d6b66d9f19ea2c59c11ff7061'){throw 'P34_ORIGINAL_SOURCE_MOUNTAINCAR_REGISTRATION_CHANGED'}
          if(-not(Test-Path -LiteralPath (Join-Path $root 'scripts/native_p34_mountaincar_reward_ppo_dev.py') -PathType Leaf)){throw 'P34_CORRECT_NONCARTPOLE_ENTRYPOINT_MISSING'}
          if(-not(Test-Path -LiteralPath (Join-Path $root 'scripts/native_p35_mountaincar_factual_aux_ppo_dev.py') -PathType Leaf)){throw 'P35_SOURCE_ACTION_CONSEQUENCE_TRAINER_ABSENT'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P33_QUALIFIED_CPU_INTERPRETER_MISSING'}
          $versions=@(& $py -I -B -c 'import torch,pytest,numpy;print(torch.__version__);print(pytest.__version__);print(numpy.__version__)')
          if($LASTEXITCODE -ne 0 -or $versions.Count -ne 3 -or $versions[0] -cne '2.5.1+cpu' -or $versions[1] -cne '8.3.4' -or $versions[2] -cne '1.26.4'){throw 'P33_QUALIFIED_CPU_TOOLCHAIN_DRIFT'}
