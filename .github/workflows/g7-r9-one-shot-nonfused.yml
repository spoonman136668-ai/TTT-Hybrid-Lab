# G7-R9: source-qualified owner-activated *single-use* non-fused forward.
# DO NOT MERGE without separate explicit authorization: a main push triggers CUDA.
# No binary installs, no training, no additional controller/runner.
# Never dispatch on PR, schedule or workflow_dispatch. Owner-only main push, first attempt only.
name: G7-R9 single non-fused forward-only CUDA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g7-r9-one-shot-nonfused.yml"

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g7-r9-single-forward
  cancel-in-progress: false

jobs:
  authentic-forward:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 7
    steps:
      - name: Checkout immutable accepted commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
      - name: Execute bounded exact-source authentic forward-only check
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_RUN_NUMBER -cne '1' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
              $env:RUNNER_OS -cne 'Windows') {
            throw 'G7_R9_ADMISSION_DENIED'
          }
          $head = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'G7_R9_SHA_DRIFT'
          }
          $dirty = (git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) {
            throw 'G7_R9_DIRTY_CHECKOUT'
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'local_runs') | Out-Null
          $linuxRoot = (& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $linuxRoot -notmatch '^/mnt/[a-z]/') {
            throw 'G7_R9_WSL_PATH_UNAVAILABLE'
          }
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 240s /usr/bin/python3 -I -B "$linuxRoot/scripts/g7_r6_oneshot.py" --require-nonfused --expected-sha "$env:GITHUB_SHA" --receipt "$linuxRoot/local_runs/g7_r9_nonfused_forward.json"
          if ($LASTEXITCODE -ne 0) { throw 'G7_R9_FORWARD_GATE_NOT_PASS_SEE_RECEIPT' }
          Write-Output 'G7_R9_ONE_SHOT_NATIVE_FORWARD_ACCEPTED'
      - name: Retain sanitized immutable acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-r9-forward-${{ github.sha }}-${{ github.run_id }}
          path: local_runs/g7_r9_nonfused_forward.json
          if-no-files-found: warn
          retention-days: 30
