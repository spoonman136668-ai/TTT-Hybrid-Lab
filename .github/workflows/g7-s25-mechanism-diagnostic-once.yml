# G7-S25 one-use untrained mechanism diagnostic: actual triggers vs forced K8 budget.
# No training, heldout world generation, new runtime, package install, or acceptance.
name: G7-S25 untrained contradiction trigger versus budget diagnostic
on:
  push:
    branches:
      - research/g7-s25-contradiction-ttt-frozen-20261107
    paths:
      - .github/workflows/g7-s25-mechanism-diagnostic-once.yml
permissions:
  contents: read
concurrency:
  group: ttt-g7-s25-mechanism-diagnostic-once
  cancel-in-progress: false
jobs:
  actual-untrained-trigger-ledger-engineering:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/research/g7-s25-contradiction-ttt-frozen-20261107' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 9
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: g7-s25-mechanism-isolated
          fetch-depth: 110
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Verify frozen source and all source-only baseline admission tests
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'g7-s25-mechanism-isolated'
          $out=Join-Path $root 'local_runs'
          $receipt=[ordered]@{
            schema='ttt-hybrid.g7-s25.baseline-admission-once.v1'
            candidate_sha=$env:GITHUB_SHA
            frozen_base='7d1f8bb1547d4d39df7412091a68dabb03f0ac3f'
            status='BLOCKED_NOT_STARTED'
            source_custody='UNVERIFIED'
            focused_tests='NOT_RUN'
            baseline_training='NOT_RUN'
            baseline_qualification='UNVERIFIED'
            gate_mechanism='NOT_RUN'
            contradiction_nonforced_trigger_updates=$null
            post_switch_nonforced_trigger_updates=$null
            full_windows_linux_regression='UNVERIFIED'
            scientific_first_use='NOT_RUN'
            heldout='NOT_RUN'
            cuda='NOT_USED'
            package_installs='NONE'
            accepted_ref='UNCHANGED'
            deployment='NOT_AUTHORIZED'
          }
          try {
            if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
                $env:GITHUB_REF -cne 'refs/heads/research/g7-s25-contradiction-ttt-frozen-20261107' -or
                $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
                $env:GITHUB_EVENT_NAME -cne 'push' -or
                $env:GITHUB_RUN_NUMBER -cne '1' -or
                $env:GITHUB_RUN_ATTEMPT -cne '1' -or
                $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
                $env:RUNNER_OS -cne 'Windows') {
              $receipt.status='BLOCKED_SCOPE_OR_RUNNER'
              throw 'INVALID_AUTHORITY'
            }
            $head=(& git -C $root rev-parse HEAD | Out-String).Trim()
            $hc=$LASTEXITCODE
            $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
            $dc=$LASTEXITCODE
            $changed=@(& git -C $root diff --name-only '7d1f8bb1547d4d39df7412091a68dabb03f0ac3f' HEAD)
            $cc=$LASTEXITCODE
            $expected=@(
              '.github/workflows/g7-s25-cost-ledger-qualification.yml',
              '.github/workflows/g7-s25-cost-ledger-qualification-r2.yml',
              '.github/workflows/g7-s25-gate-design-qualification.yml',
              '.github/workflows/g7-s25-numeric-engineering.yml',
              '.github/workflows/g7-s25-paired-physics-engineering.yml',
              '.github/workflows/g7-s25-baseline-contract-once.yml',
              '.github/workflows/g7-s25-causal-stream-once.yml',
              '.github/workflows/g7-s25-full-regression-existing-runtime.yml',
              '.github/workflows/g7-s25-primary-residual-once.yml',
              'scripts/g7_s25_gate_diagnostic.py',
              'tests/test_g7_s25_gate_diagnostic.py',
              '.github/workflows/g7-s25-mechanism-diagnostic-once.yml',
              'tests/test_g7_s25_realized_primary.py',
              'scripts/g7_s25_causal_baseline_stream.py',
              'tests/test_g7_s25_causal_baseline_stream.py',
              'experiments/g7_s25_frozen_contradiction_ttt.json',
              'scripts/g7_s25_contradiction_gate.py',
              'scripts/g7_s25_numeric_ttt.py',
              'scripts/g7_s25_paired_interventions.py',
              'scripts/g7_s25_cost_ledger.py',
              'scripts/g7_s25_engineering_qualifier.py',
              'scripts/g7_s25_baseline_admission.py',
              'tests/test_g7_s25_gate_contract.py',
              'tests/test_g7_s25_numeric_ttt.py',
              'tests/test_g7_s25_paired_interventions.py',
              'tests/test_g7_s25_cost_ledger.py',
              'tests/test_g7_s25_baseline_admission.py'
            )
            $unique=@($expected | Select-Object -Unique)
            if ($hc -ne 0 -or $dc -ne 0 -or $cc -ne 0 -or
                $head -cne $env:GITHUB_SHA -or $dirty -or
                $expected.Count -ne 27 -or $unique.Count -ne 27 -or
                $changed.Count -ne $expected.Count) {
              $receipt.status='BLOCKED_EXACT_SHA_OR_SCOPE'
              throw 'CUSTODY_DRIFT'
            }
            foreach ($name in $expected) {
              if ($changed -cnotcontains $name) {
                $receipt.status='BLOCKED_UNEXPECTED_FILE'
                throw 'UNEXPECTED_FILE'
              }
            }
            $receipt.source_custody='PASS_EXACT_SHA_TWENTYSEVEN_UNIQUE_FILES'
            $linux=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$root" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $linux -notmatch '^/mnt/[a-z]/') {
              $receipt.status='BLOCKED_WSL_PATH'
              throw 'WSL'
            }
            $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $uid -cne '1000') {
              $receipt.status='BLOCKED_NORMAL_USER'
              throw 'NORMAL_USER_REQUIRED'
            }
            $proof=@(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 300s /usr/bin/python3 -I -B "$linux/scripts/g7_s25_engineering_qualifier.py" --sha "$env:GITHUB_SHA")
            $rc=$LASTEXITCODE
            $report=Join-Path $out 'g7_s25_numeric_engineering.json'
            if ($rc -ne 0 -or -not (Test-Path -LiteralPath $report)) {
              $receipt.status='BLOCKED_QUALIFICATION_OR_TESTS'
              throw 'FOCUSED_FAILED'
            }
            $q=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            $receipt.focused_tests=$q.status
            if ($q.sha -cne $env:GITHUB_SHA -or
                $q.source -cne 'PASS_EXACT_TWENTYSEVEN_FILES_FROZEN_S25_AND_S20_BLOBS' -or
                $q.status -cne 'PASS_78_FOCUSED_ENGINEERING_ONLY' -or
                $q.pinned_environment -cne 'PASS_EXISTING_EXACT_R3_MANIFEST' -or
                $q.scientific_first_use -cne 'NOT_RUN' -or
                $q.training -cne 'NOT_RUN' -or
                $q.calibration -cne 'NOT_RUN' -or
                $q.heldout -cne 'NOT_RUN' -or
                $q.gpu -cne 'NOT_USED' -or
                $q.packages_changed -cne $false) {
              $receipt.status='BLOCKED_UNQUALIFIED_RECEIPT'
              throw 'INVALID_RECEIPT'
            }
            # Execute only the frozen-pattern engineering diagnostic, never
            # the preregistered science fit/validation/heldout seed sets.
            $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $who) {
              $receipt.status='BLOCKED_NO_EXISTING_NONROOT_ENVIRONMENT'
              throw 'MISSING_NORMAL_USER'
            }
            $venv='/home/'+$who+'/.local/share/ttt-hybrid/g7-r3-06a01c2c3a98/venv/bin/python'
            $diagPath=$linux+'/local_runs/g7_s25_gate_diagnostic.json'
            $raw=@(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 190s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'OMP_NUM_THREADS=1' 'MKL_NUM_THREADS=1' $venv -I -B "$linux/scripts/g7_s25_gate_diagnostic.py" --expected-sha "$env:GITHUB_SHA" --receipt $diagPath)
            $diagCode=$LASTEXITCODE
            $diagFile=Join-Path $out 'g7_s25_gate_diagnostic.json'
            if ($diagCode -ne 0 -or -not (Test-Path -LiteralPath $diagFile)) {
              $receipt.status='BLOCKED_UNTRAINED_MECHANISM_EXECUTION'
              throw 'ENGINEERING_DIAGNOSTIC_FAILED'
            }
            $data=Get-Content -LiteralPath $diagFile -Raw | ConvertFrom-Json
            if ($data.candidate_sha -cne $env:GITHUB_SHA -or
                $data.status -cne 'PASS_DEVELOPMENT_MECHANISM_DIAGNOSTIC_EXECUTED' -or
                $data.rows.Count -ne 48 -or
                $data.summary.status -cnotin @('UNTRAINED_DIAGNOSTIC_TRIGGER_NULL','UNTRAINED_DIAGNOSTIC_TRIGGER_EXERCISED_NOT_SCIENCE') -or
                $data.untrained_slow_weights -cne $true -or
                $data.all_policy_arms_same_observed_stream -cne $true -or
                $data.frozen_scientific_seeds_used -cne $false -or
                $data.baseline_fitting -cne 'NOT_RUN' -or
                $data.scientific_first_use -cne 'NOT_RUN' -or
                $data.heldout -cne 'NOT_RUN' -or
                $data.gpu -cne 'NOT_USED' -or
                $data.scientific_qualification -cne 'NOT_SCIENTIFIC_PASS') {
              $receipt.status='BLOCKED_MECHANISM_RECEIPT'
              throw 'MECHANISM_DIAGNOSTIC_RECEIPT_INVALID'
            }
            foreach ($row in $data.rows) {
              if ($row.worlds -ne 4 -or
                  $row.real_fast_weight_update_worlds -ne 32 -or
                  $row.observed_action_pairs -ne 256 -or
                  $row.updates_by_time.Count -ne 32) {
                $receipt.status='BLOCKED_MECHANISM_BUDGET'
                throw 'MECHANISM_DIAGNOSTIC_BUDGET_MISMATCH'
              }
            }
            $receipt.gate_mechanism=$data.summary.status
            $receipt.contradiction_nonforced_trigger_updates=$data.summary.untrained_contradiction_selected_trigger_world_steps
            $receipt.post_switch_nonforced_trigger_updates=$data.summary.untrained_signflip_post_switch_selected_trigger_world_steps
            $receipt.status='PASS_78_FOCUSED_UNTRAINED_MECHANISM_DIAGNOSTIC'
            Write-Output ('S25_MECHANISM=' + $receipt.gate_mechanism)
            Write-Output ('S25_CONTRADICTION_NONFORCED_SELECTED=' + $receipt.contradiction_nonforced_trigger_updates)
            Write-Output ('S25_POSTSWITCH_NONFORCED_SELECTED=' + $receipt.post_switch_nonforced_trigger_updates)
            Write-Output 'S25_BASELINE_CONTRACT=PASS_16_SYNTHETIC_RECEIPT_TESTS'
            Write-Output 'S25_ALL_FOCUSED=PASS_78'
            Write-Output 'S25_TRAINING=NOT_RUN'
            Write-Output 'S25_SCIENCE=NOT_RUN'
          } finally {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'g7_s25_baseline_workflow_custody.json') -Encoding UTF8
            Write-Output ('S25_BASELINE_ENGINEERING_GATE=' + $receipt.status)
          }

      - name: Preserve candidate-SHA and pre-first-use receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-s25-mechanism-diagnostic-${{ github.sha }}
          path: |
            g7-s25-mechanism-isolated/local_runs/g7_s25_baseline_workflow_custody.json
            g7-s25-mechanism-isolated/local_runs/g7_s25_numeric_engineering.json
            g7-s25-mechanism-isolated/local_runs/g7_s25_gate_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
