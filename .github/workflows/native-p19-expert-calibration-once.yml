# P19 source-pinned public DEV teacher-calibration, not original sealed science.
name: Native P19 real CartPole learned-control capability once
on:
  push:
    branches:
      - engineering/native-p19-expert-calibration-dev-20261108
    paths:
      - .github/workflows/native-p19-expert-calibration-once.yml
permissions:
  contents: read
concurrency:
  group: native-p19-expert-calibration-once
  cancel-in-progress: false
jobs:
  real-dev-calibration:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p19-expert-calibration-dev-20261108' && github.actor == 'spoonman136668-ai' && github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 25
    steps:
      - name: Checkout exact P19 candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: p19-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 180
      - name: Checkout original separately owned S29 admission code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: spoonman136668-ai/TTT-Hybrid-Lab
          ref: 30c27ca4865e16b7574ee2b562879108db2b3796
          path: p19-s29-owner
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Checkout actual upstream pinned MIT source, no package install
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Farama-Foundation/Gymnasium
          ref: 17eff00220d210beda933f78b0e52850022b0690
          path: p19-mit-gym
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Checkout actual upstream pinned BSD3 dependency, no installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cloudpipe/cloudpickle
          ref: ff54d93221082d4ce22630ecdb8fbbccc60f3b62
          path: p19-bsd3-cloudpickle
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Verify owner, original failure preservation and frozen P19 sources
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'P19_OWNER_ONE_USE_DENIED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'p19-candidate'
          $s29=Join-Path $env:GITHUB_WORKSPACE 'p19-s29-owner'
          $mit=Join-Path $env:GITHUB_WORKSPACE 'p19-mit-gym'
          $bsd=Join-Path $env:GITHUB_WORKSPACE 'p19-bsd3-cloudpickle'
          $actual=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA){throw 'P19_CANDIDATE_SHA_MISMATCH'}
          & git -C $root merge-base --is-ancestor '675ef40f80c43814cc320d6b9950d37a9395c0f8' HEAD
          if($LASTEXITCODE -ne 0){throw 'P19_P18_FROZEN_FAILURE_ANCESTRY_DRIFT'}
          $expected=@{
            'experiments/native_p19_expert_calibration_frozen.json'='cbaa42bfba413ffc9f1b3c9f9db6faa93a542da3';
            'scripts/native_p19_expert_calibration_dev.py'='7fb65ed5bc59fc2ad7a8c8442624b3d21fb86c5d';
            'tests/test_native_p19_expert_calibration_dev.py'='bdf4137048ad3b155724b01c742699f1f20167d7';
            'scripts/native_p18_real_cartpole_factual_dev.py'='0c5c0079614624d1264e477ea90b483cbe63d586';
            'tests/test_native_p18_real_cartpole_factual_dev.py'='a97458f5a9bc1bedc9e2e941cc0bddc987e27bc3';
            'experiments/native_p18_real_cartpole_factual_frozen.json'='fd4828f971acb7e052dc6ff7f78314267bef202b'
          }
          foreach($name in $expected.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $expected[$name]){throw "P19_FROZEN_BLOB_DRIFT:$name"}
          }
          if((& git -C $s29 rev-parse HEAD|Out-String).Trim() -cne '30c27ca4865e16b7574ee2b562879108db2b3796' -or (& git -C $mit rev-parse HEAD|Out-String).Trim() -cne '17eff00220d210beda933f78b0e52850022b0690' -or (& git -C $bsd rev-parse HEAD|Out-String).Trim() -cne 'ff54d93221082d4ce22630ecdb8fbbccc60f3b62'){throw 'P19_EXTERNAL_SOURCE_IDENTITY_DRIFT'}
          foreach($d in @($root,$s29,$mit,$bsd)){
            $dirty=(& git -C $d status --porcelain --untracked-files=all|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $dirty){throw "P19_SOURCE_NOT_CLEAN:$d"}
          }
          $f=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p19_expert_calibration_frozen.json') -Raw|ConvertFrom-Json
          if($f.schema -cne 'ttt-hybrid.native-p19.expert-calibration-frozen.v1' -or $f.science.authorized -ne $false -or $f.science.first_use_consumed -ne $false -or $f.design.epochs -ne 32 -or @($f.design.evaluation_reset_seeds).Count -ne 8){throw 'P19_SCIENCE_FENCE_OR_PROTOCOL_DRIFT'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P19_EXISTING_CPU_OWNER_ENV_MISSING'}
          $versions=@(& $py -I -B -c 'import torch,pytest,numpy;print(torch.__version__);print(pytest.__version__);print(numpy.__version__)')
          if($LASTEXITCODE -ne 0 -or $versions.Count -ne 3 -or $versions[0] -cne '2.5.1+cpu' -or $versions[1] -cne '8.3.4' -or $versions[2] -cne '1.26.4'){throw 'P19_OWNER_DEPENDENCY_DRIFT'}
          Write-Output 'P19_EXACT_SOURCE_AND_ORIGINAL_NEGATIVES=PASS'
      - name: Mandatory original full Windows regression plus CUDA negatives
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p19-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:OMP_NUM_THREADS='1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p19_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P19_WINDOWS_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p19_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P19_WINDOWS_ORIGINAL_NEGATIVE_FAIL'}
          Write-Output 'P19_WINDOWS_FULL_EXACT_SHA=PASS'
      - name: Mandatory original full Ubuntu WSL regression plus source negatives
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $who -or -not $lp){throw 'P19_WSL_OWNER_DRIFT'}
          $root="$lp/p19-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p19_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P19_WSL_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'p19-candidate\local_runs\native_p19_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P19_WSL_ORIGINAL_NEGATIVE_FAIL'}
          Write-Output 'P19_LINUX_FULL_EXACT_SHA=PASS'
      - name: One bounded public DEV real-source capability calibration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $lp -or -not $who){throw 'P19_WSL_SOURCE_MISSING'}
          $root="$lp/p19-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 290s /usr/bin/env 'NATIVE_P19_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/native_p19_expert_calibration_dev.py" --s29-root "$lp/p19-s29-owner" --source-root "$lp/p19-mit-gym" --cloudpickle-root "$lp/p19-bsd3-cloudpickle" --receipt "$root/local_runs/native_p19_real_cartpole.json"
          if($LASTEXITCODE -ne 0){throw 'P19_PUBLIC_DEV_CAPABILITY_CALIBRATION_FAILED'}
          $p=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'p19-candidate\local_runs\native_p19_real_cartpole.json') -Raw|ConvertFrom-Json
          if($p.status -cne 'PASS_DEV_ENGINEERING_NOT_SCIENCE' -or $p.scientific_first_use -cne 'NOT_RUN' -or @($p.protected_scientific_worlds_consumed).Count -ne 0 -or @($p.per_initialization).Count -ne 3 -or @($p.evaluation_worlds).Count -ne 8 -or $p.teacher_labels_used_for_supervised_training -ne $true -or $p.reward_only_competence_proven -ne $false){throw 'P19_RECEIPT_INTEGRITY_FAIL'}
          Write-Output "P19_DEV_ENGINEERING=PASS LEARNED_LINEAR_COMPETENCE_SUPPORT=$($p.three_initialization_learned_linear_competence_support)/3 SCIENTIFIC_FIRST_USE=NOT_RUN"
      - name: Preserve exact regression, demonstration, full negative and null receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p19-real-factual-calibration-once
          path: p19-candidate/local_runs/native_p19_*.json
          retention-days: 30
          if-no-files-found: warn
