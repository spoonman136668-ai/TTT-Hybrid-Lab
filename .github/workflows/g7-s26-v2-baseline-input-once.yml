# Once-only native Windows + WSL CPU regression of versioned S25 portability.
# No scientific first-use, model training, CUDA, R3 writes or owner changes.
name: G7-S26 development baseline input contracts and full dual-platform regression
on:
  push:
    branches:
      - engineering/g7-s26-on-v2-qualification-20261107
    paths:
      - .github/workflows/g7-s26-v2-baseline-input-once.yml
permissions:
  contents: read
concurrency:
  group: ttt-hybrid-s26-v2-dev-baseline-inputs-once
  cancel-in-progress: false
jobs:
  exact-head-cross-platform:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/g7-s26-on-v2-qualification-20261107' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 24
    steps:
      - name: Check out exact versioned engineering candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: g7-s26-v2-engineering
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          fetch-depth: 120

      - name: Read-only custody, isolated native environments and R3 admission
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
             $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_RUN_NUMBER -cne '1'){throw 'BLOCKED_OWNER_OR_ONE_USE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'g7-s26-v2-engineering'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_SOURCE_HEAD'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_DIRTY_SOURCE'}
          $protocol=(& git -C $root hash-object -- experiments/g7_s25_frozen_contradiction_ttt.json|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $protocol -cne '31633b341403729b7ffbb7d73f3a04098ad44380'){throw 'BLOCKED_FROZEN_S25_PROTOCOL'}
          $science=(& git -C $root hash-object -- experiments/g7_s20_frozen_hidden_multicycle.json|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $science -cne '05a38c0161ed67fc5f839947baaf3d4153d64a18'){throw 'BLOCKED_FROZEN_S20_PROTOCOL'}
          $pins=(& git -C $root hash-object -- source_pins.json|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $pins -cne '1438b51f8548db6bfe7e04805ba8c156e4b5b630'){throw 'BLOCKED_SOURCE_PINS'}
          $original=(& git -C $root hash-object -- scripts/g7_s20_hidden_multicycle.py|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $original -ceq 'ac3f9ddd5b879e53e62030707fb6419adaf732ca'){throw 'BLOCKED_VERSIONED_SOURCE_NOT_SEPARATE'}
          $winPy=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $uvRoot=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1'
          $zip=Join-Path $uvRoot 'uv.zip'
          if(-not(Test-Path -LiteralPath $winPy -PathType Leaf) -or
             -not(Test-Path -LiteralPath $zip -PathType Leaf)){throw 'BLOCKED_WINDOWS_CPU311_ABSENT'}
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne 'cdfb04512c9184939f16eea02644a7133b4e41233ead69122d49847d29a45538'){throw 'BLOCKED_UV_ARCHIVE_DRIFT'}
          $winProbe=(& $winPy -I -B (Join-Path $root 'scripts\g7_s25_portable_runtime_probe.py') --mode cpu|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WINDOWS_RUNTIME_PROBE'}
          $w=ConvertFrom-Json $winProbe
          if($w.torch -cne '2.5.1+cpu' -or $w.pytest -cne '8.3.4' -or
             $w.python[0] -ne 3 -or $w.python[1] -ne 11 -or $w.python[2] -ne 14 -or
             ($w.numpy -and $w.numpy -cne '1.26.4')){throw 'BLOCKED_WINDOWS_RUNTIME_DRIFT'}
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          $userName=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($uid -cne '1000' -or -not $lp -or $LASTEXITCODE -ne 0){throw 'BLOCKED_WSL_USER'}
          $probe="$lp/g7-s26-v2-engineering/scripts/g7_s25_portable_runtime_probe.py"
          $linuxPy="/home/$userName/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $r3Py="/home/$userName/.local/share/ttt-hybrid/g7-r3-06a01c2c3a98/venv/bin/python"
          $linRaw=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout 45s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' $linuxPy -I -B $probe --mode cpu|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_LINUX_CPU311_PROBE'}
          $linux=ConvertFrom-Json $linRaw
          if($linux.numpy -cne '1.26.4'){throw 'BLOCKED_WSL_NUMPY_DRIFT'}
          $r3Raw=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout 30s $r3Py -I -B $probe --mode r3|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_R3_PROVENANCE'}
          $r3=ConvertFrom-Json $r3Raw
          if($r3.r3_manifest_sha256 -cne 'b0f674fd52f9f514d408840d27b969ce2da19ea119d90a6ce8f59fde05c073df'){throw 'BLOCKED_R3_DRIFT'}
          Write-Output 'PORTABILITY_PREFLIGHT=PASS_SOURCE_AND_CPU_ENVIRONMENTS_R3_READONLY'
      - name: Prove 15 original S26 blobs and derivative-only source revision on Windows and WSL
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'g7-s26-v2-engineering'
          $manifest=Join-Path $root 'experiments/g7_s26_v2_engineering_overlay_custody.json'
          $p=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if($p.schema -cne 'ttt-hybrid.g7-s26.v2-engineering-overlay-custody.v1' -or
             $p.qualified_portable_v2_head -cne '55f2dd4cd2699e6910a727ab691f3e26ccc3222e' -or
             $p.original_s26_head -cne 'b8f4bc6628e15057b76dc1f085c6067b972cd5f9' -or
             $p.original_s26_frozen_protocol_blob -cne '34251b2cde6373ed484dbc21e4617c9165047e93' -or
             $p.scientific_first_use -cne 'NOT_AUTHORIZED_NOT_RUN'){
            throw 'BLOCKED_S26_V2_COMPOSITE_SOURCE_REGISTER_DRIFT'
          }
          & git -C $root merge-base --is-ancestor '55f2dd4cd2699e6910a727ab691f3e26ccc3222e' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_NOT_DESCENDED_FROM_QUALIFIED_V2'}
          $scope=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1'
          $py=Join-Path $scope 'venv\Scripts\python.exe'
          $probe=Join-Path $root 'scripts/g7_s25_portable_runtime_probe.py'
          $w=ConvertFrom-Json ((& $py -I -B $probe --mode cpu | Out-String).Trim())
          if($LASTEXITCODE -ne 0 -or $w.numpy -cne '1.26.4' -or
             $w.torch -cne '2.5.1+cpu' -or $w.pytest -cne '8.3.4'){
            throw 'BLOCKED_WINDOWS_PINNED_CPU311_NOT_ALREADY_QUALIFIED'
          }
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:CUDA_VISIBLE_DEVICES='-1'
          & $py -I -B (Join-Path $root 'tests/test_g7_s26_v2_engineering_custody.py')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WINDOWS_S26_SOURCE_CUSTODY_NEGATIVE'}
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){
            throw 'BLOCKED_WSL_AUTHORIZED_UNPRIVILEGED_USER'
          }
          $linuxRoot="$lp/g7-s26-v2-engineering"
          $linuxPy="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/env 'PYTHONDONTWRITEBYTECODE=1' 'CUDA_VISIBLE_DEVICES=-1' $linuxPy -I -B "$linuxRoot/tests/test_g7_s26_v2_engineering_custody.py"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_LINUX_S26_SOURCE_CUSTODY_NEGATIVE'}
          Write-Output 'G7_S26_COMPOSITE_SOURCE=PASS_8_NATIVE_WINDOWS_AND_8_WSL_NEGATIVE_CONTROLS'
          Write-Output 'ORIGINAL_S25_S26_SCIENTIFIC_SOURCE_ADMISSION=BLOCKED_UNCHANGED'
      - name: Verify causal GRU/KRR development data stream (no fitting) on native Windows and WSL
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'g7-s26-v2-engineering'
          $scope=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1'
          $winPy=Join-Path $scope 'venv\Scripts\python.exe'
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:CUDA_VISIBLE_DEVICES='-1'
          $env:PYTHONHASHSEED='0'
          & $winPy -I -B (Join-Path $root 'tests/test_g7_s26_v2_baseline_observations.py')
          if($LASTEXITCODE -ne 0){throw 'S26_DEV_BASELINE_WINDOWS_TEN_CONTROLS_FAILED'}
          $winReceipt=Join-Path $root 'local_runs\g7_s26_dev_baseline_inputs_windows.json'
          & $winPy -I -B (Join-Path $root 'scripts\g7_s26_v2_baseline_observations.py') --expected-sha $env:GITHUB_SHA --receipt $winReceipt
          if($LASTEXITCODE -ne 0){throw 'S26_DEV_BASELINE_WINDOWS_READOUT_FAILED'}
          $win=Get-Content -LiteralPath $winReceipt -Raw | ConvertFrom-Json
          if($win.candidate_sha -cne $env:GITHUB_SHA -or
             $win.status -cne 'PASS_DEVELOPMENT_PREQUENTIAL_INPUTS_NO_MODEL_FIT' -or
             $win.rows.Count -ne 3 -or
             $win.paired_world_steps -ne 3072 -or
             $win.actual_observations -ne 6144 -or
             $win.scientific_first_use -cne 'NOT_AUTHORIZED_NOT_RUN' -or
             $win.conventional_baseline_fit -cne 'NOT_RUN' -or
             $win.krr_calibration -cne 'NOT_RUN' -or
             $win.frozen_fit_validation_and_heldout_seeds -cne 'NOT_CONSUMED'){
            throw 'S26_DEV_BASELINE_WINDOWS_PROVENANCE_INVALID'
          }
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){
            throw 'S26_DEV_BASELINE_WSL_USER_UNQUALIFIED'
          }
          $linux="$lp/g7-s26-v2-engineering"
          $linuxPy="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 70s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $linuxPy -I -B "$linux/tests/test_g7_s26_v2_baseline_observations.py"
          if($LASTEXITCODE -ne 0){throw 'S26_DEV_BASELINE_LINUX_TEN_CONTROLS_FAILED'}
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $linuxPy -I -B "$linux/scripts/g7_s26_v2_baseline_observations.py" --expected-sha $env:GITHUB_SHA --receipt "$linux/local_runs/g7_s26_dev_baseline_inputs_linux.json"
          if($LASTEXITCODE -ne 0){throw 'S26_DEV_BASELINE_LINUX_READOUT_FAILED'}
          $lin=Get-Content -LiteralPath (Join-Path $root 'local_runs\g7_s26_dev_baseline_inputs_linux.json') -Raw | ConvertFrom-Json
          if($lin.candidate_sha -cne $env:GITHUB_SHA -or
             $lin.status -cne $win.status -or
             $lin.rows.Count -ne 3 -or
             $lin.paired_world_steps -ne 3072 -or
             $lin.actual_observations -ne 6144 -or
             $lin.scientific_first_use -cne 'NOT_AUTHORIZED_NOT_RUN' -or
             $lin.conventional_baseline_fit -cne 'NOT_RUN' -or
             $lin.krr_calibration -cne 'NOT_RUN' -or
             $lin.frozen_fit_validation_and_heldout_seeds -cne 'NOT_CONSUMED'){
            throw 'S26_DEV_BASELINE_LINUX_PROVENANCE_INVALID'
          }
          Write-Output 'S26_DEV_BASELINE_INPUTS=PASS_10_WINDOWS_AND_10_LINUX_CAUSAL_CONTROLS'
          Write-Output 'S26_DEV_INPUTS=3_SEEDS_3072_PAIRED_STEPS_6144_TARGETS'
          Write-Output 'S26_BASELINE_TRAINING=NOT_RUN'
          Write-Output 'S26_SCIENTIFIC_FIRST_USE=NOT_RUN'

      - name: Full native Windows candidate regression and original-source negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'g7-s26-v2-engineering'
          $python=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $out=Join-Path $root 'local_runs\g7_s25_portability_windows.json'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $python -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt $out
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_NATIVE_WINDOWS_FULL_REGRESSION'}
          $q=Get-Content -LiteralPath $out -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or
             $q.revision -cne $env:GITHUB_SHA -or
             $q.checkout_identity.pass -ne $true -or
             $q.negative_control.pass -ne $true -or
             $q.tests.exit_code -ne 0){throw 'BLOCKED_WINDOWS_RECEIPT'}
          Write-Output 'WINDOWS_PORTABILITY_EXACT_CANDIDATE=PASS_ENG_ONLY'

      - name: Full WSL Linux candidate regression and original-source negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $userName=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $lp){throw 'BLOCKED_WSL_PATH'}
          $root="$lp/g7-s26-v2-engineering"
          $python="/home/$userName/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $out="$root/local_runs/g7_s25_portability_linux.json"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=10s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $python -I -B "$root/scripts/qualify_cpu.py" --receipt $out
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_LINUX_FULL_REGRESSION'}
          $receipt=Join-Path $env:GITHUB_WORKSPACE 'g7-s26-v2-engineering\local_runs\g7_s25_portability_linux.json'
          $q=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or
             $q.revision -cne $env:GITHUB_SHA -or
             $q.checkout_identity.pass -ne $true -or
             $q.negative_control.pass -ne $true -or
             $q.tests.exit_code -ne 0){throw 'BLOCKED_LINUX_RECEIPT'}
          Write-Output 'LINUX_PORTABILITY_EXACT_CANDIDATE=PASS_ENG_ONLY'

      - name: Confirm R3 baseline package manifest unchanged
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $r3="/home/$who/.local/share/ttt-hybrid/g7-r3-06a01c2c3a98/venv/bin/python"
          $probe="$lp/g7-s26-v2-engineering/scripts/g7_s25_portable_runtime_probe.py"
          $raw=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout 30s $r3 -I -B $probe --mode r3|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not($raw -match 'b0f674fd52f9f514d408840d27b969ce2da19ea119d90a6ce8f59fde05c073df')){throw 'BLOCKED_R3_POST_REGRESSION_DRIFT'}
          Write-Output 'R3_PRE_POST_MANIFEST=PASS_UNCHANGED'

      - name: Preserve exact SHA test and negative-control receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g7-s26-v2-dev-baseline-qualification-${{ github.sha }}-${{ github.run_id }}
          path: g7-s26-v2-engineering/local_runs/*.json
          retention-days: 30
          if-no-files-found: warn
