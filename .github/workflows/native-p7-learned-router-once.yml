# Single-use native project-owned engineering test, never scientific first-use.
name: Native P7 gradient-learned factual history vs trained MLP once
on:
  push:
    branches:
      - engineering/native-p7-learned-history-gate-20261108
    paths:
      - .github/workflows/native-p7-learned-router-once.yml
permissions:
  contents: read
concurrency:
  group: native-p7-learned-router-single-use
  cancel-in-progress: false
jobs:
  native-dev-windows-wsl:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p7-learned-history-gate-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p7-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 150
      - name: Verify exact source ancestry, frozen protocol and science fence
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'P7_OWNER_SINGLE_USE_BLOCKED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'P7_EXACT_SHA_BLOCKED'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'P7_DIRTY_CHECKOUT_BLOCKED'}
          & git -C $root merge-base --is-ancestor '1123a8aee15572f7f2602bce135a0f38c7b9909a' HEAD
          if($LASTEXITCODE -ne 0){throw 'P7_ORIGINAL_P6_ANCESTRY_BLOCKED'}
          $originals=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_continuous_state.py'='38ebbfb339026f3213a8c380e090480609288917';
            'scripts/native_prequential_gate.py'='fe1016f19a8671d071f7f2230e9dcf0e96cf282f';
            'scripts/native_p6_hidden_context_dev.py'='7f21b73d6255f2611512969e87446352c1dee90c';
            'scripts/native_p7_learned_router_dev.py'='7db1fe42695f16bf2afe730f4348210156ac3c24';
            'tests/test_native_p7_learned_router_dev.py'='0be05579ba1ec11bd95a86000be46ad9efac4dc7';
            'experiments/native_p7_learned_router_dev_frozen.json'='1ca3b8fa6b9f425bb4aea35462084c7e1fb5530e'
          }
          foreach($name in $originals.Keys){
            $digest=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $digest -cne $originals[$name]){throw "P7_FROZEN_BLOB_DRIFT:$name"}
          }
          $f=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p7_learned_router_dev_frozen.json') -Raw|ConvertFrom-Json
          if($f.science.authorized -ne $false -or $f.science.consumed -ne $false -or @($f.science.world_seeds.PSObject.Properties).Count -ne 0 -or $f.design.actual_gradient_steps_per_model -ne 600 -or $f.design.examples_train -ne 6000 -or $f.design.examples_validation -ne 1920){throw 'P7_SCIENCE_OR_PROTOCOL_BLOCKED'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P7_EXISTING_CPU_ENV_MISSING'}
          $torch=(& $py -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          $pytest=(& $py -I -B -c 'import pytest;print(pytest.__version__)'|Out-String).Trim()
          $numpy=(& $py -I -B -c 'import numpy;print(numpy.__version__)'|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $torch -cne '2.5.1+cpu' -or $pytest -cne '8.3.4' -or -not $numpy){throw 'P7_EXISTING_CPU_RUNTIME_MISSING_OR_DRIFT'}
          Write-Output "P7_EXACT_SOURCE_SCIENCE_FENCE_CPU_RUNTIME=PASS; numpy=$numpy"
      - name: Full Windows engineering regression and source negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0';$env:OMP_NUM_THREADS='1'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p7_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P7_WIN_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p7_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P7_WIN_SOURCE_REGRESSION_RECEIPT_INVALID'}
          Write-Output 'P7_WINDOWS_FULL_CPU_AND_ORIGINAL_NEGATIVE=PASS'
      - name: Full WSL Linux engineering regression and source negative controls
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'P7_WSL_OWNER_BLOCKED'}
          $root="$lp/native-p7-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' 'OMP_NUM_THREADS=1' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p7_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P7_WSL_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate\local_runs\native_p7_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P7_WSL_SOURCE_REGRESSION_RECEIPT_INVALID'}
          Write-Output 'P7_WSL_FULL_CPU_AND_ORIGINAL_NEGATIVE=PASS'
      - name: Run one bounded actual gradient-trained factual router versus conventional MLP
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $root="$lp/native-p7-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 100s /usr/bin/env 'NATIVE_P7_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' $py -I -B "$root/scripts/native_p7_learned_router_dev.py" --receipt "$root/local_runs/native_p7_learned_router.json"
          if($LASTEXITCODE -ne 0){throw 'P7_REAL_GRADIENT_DEV_EXECUTION_FAILED'}
          $p=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p7-candidate\local_runs\native_p7_learned_router.json') -Raw|ConvertFrom-Json
          if($p.status -cne 'PASS_TRAINABLE_DEV_INTEGRITY_NOT_SCIENCE' -or $p.scientific_first_use -cne 'NOT_RUN' -or @($p.scientific_seeds_consumed).Count -ne 0 -or @($p.records).Count -ne 3 -or $p.training_example_count -ne 6000 -or $p.independent_dev_validation_example_count -ne 1920 -or $p.context_identity_used_for_training -cne 'NEVER'){throw 'P7_DEV_RECEIPT_QUALIFICATION_BLOCKED'}
          Write-Output 'P7_TRAINED_ROUTER_CONVENTIONAL_AND_NEGATIVE_RESULTS_RETAINED=PASS_ENGINEERING_ONLY'
      - name: Publish source-scoped Windows WSL and actual DEV training receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p7-learned-history-once
          path: native-p7-candidate/local_runs/native_p7_*.json
          retention-days: 30
          if-no-files-found: warn
