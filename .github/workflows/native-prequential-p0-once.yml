# One-use PRE-FIRST-USE engineering checks; does not train or construct science worlds.
name: Native P0 prequential causal-order engineering one-use
on:
  push:
    branches:
      - engineering/native-prequential-p0-preregister-20261108
    paths:
      - .github/workflows/native-prequential-p0-once.yml
permissions:
  contents: read
concurrency:
  group: native-p0-prequential-engineering-single-use
  cancel-in-progress: false
jobs:
  windows-and-wsl:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-prequential-p0-preregister-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout exact unmodified engineering candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p0-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 120
      - name: Admit original source, frozen P0 manifest, existing CPU environments
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {throw 'BLOCKED_OWNER_RUNNER_ONEUSE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p0-candidate'
          $head=(& git -C $root rev-parse HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {throw 'BLOCKED_CANDIDATE_SHA'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty) {throw 'BLOCKED_DIRTY_CHECKOUT'}
          & git -C $root merge-base --is-ancestor '7df69c701dd80799b0d1ae49cc0b7c51536051df' HEAD
          if($LASTEXITCODE -ne 0) {throw 'BLOCKED_NATIVE_V1_PARENT'}
          $expected=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_continuous_state.py'='38ebbfb339026f3213a8c380e090480609288917';
            'scripts/native_prequential_gate.py'='fe1016f19a8671d071f7f2230e9dcf0e96cf282f';
            'tests/test_native_prequential_gate.py'='09ffcb8c7897e0594531453f0fb9522ad981e8ea';
            'experiments/native_prequential_p0_engineering_frozen.json'='167a9cea7b3feae3bd20a9856c0e072a5e4c6b34'
          }
          foreach($name in $expected.Keys){
            $hash=(& git -C $root hash-object -- $name | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $hash -cne $expected[$name]){throw "BLOCKED_SOURCE_BLOB:$name"}
          }
          $protocol=Get-Content (Join-Path $root 'experiments/native_prequential_p0_engineering_frozen.json') -Raw|ConvertFrom-Json
          if($protocol.science_first_use.authorized -ne $false -or $protocol.science_first_use.world_data_consumed -ne $false -or @($protocol.science_first_use.seed_assignments.PSObject.Properties).Count -ne 0 -or $protocol.scope.model_training -ne $false) {throw 'BLOCKED_SCIENCE_FIRSTUSE_SCOPE'}
          $win=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $win -PathType Leaf)){throw 'BLOCKED_CPU311_ENV'}
          $torch=(& $win -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          $pytest=(& $win -I -B -c 'import pytest;print(pytest.__version__)'|Out-String).Trim()
          if($torch -cne '2.5.1+cpu' -or $pytest -cne '8.3.4'){throw 'BLOCKED_WIN_RUNTIME_VERSION'}
          Write-Output 'NATIVE_P0_EXACT_SOURCE_AND_ZERO_SCIENCE_FIRSTUSE=PASS'
      - name: Full Windows regression plus original negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p0-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_prequential_windows.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_FULL_WIN_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_prequential_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WIN_RECEIPT'}
          Write-Output 'FULL_NATIVE_P0_WINDOWS=PASS_ENGINEERING_ONLY'
      - name: Full WSL Linux regression plus original negative control
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'BLOCKED_WSL_OWNER_OR_PATH'}
          $root="$lp/native-p0-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $receipt="$root/local_runs/native_prequential_linux.json"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_FULL_WSL_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p0-candidate\local_runs\native_prequential_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WSL_RECEIPT'}
          Write-Output 'FULL_NATIVE_P0_WSL=PASS_ENGINEERING_ONLY'
      - name: Save source-scoped Windows and WSL receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-prequential-p0-engineering-once
          path: native-p0-candidate/local_runs/native_prequential_*.json
          retention-days: 30
          if-no-files-found: warn
