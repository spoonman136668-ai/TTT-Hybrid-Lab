name: G7 pinned Mamba2 CPU import
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-g7-mamba-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-mamba2-import:
    name: Pinned Mamba2 constructor / Ubuntu CPU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned official Mamba2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: state-spaces/mamba
          ref: e9594ce1c732d97440f0332fdc43170a2294dbfa
          path: _upstream/mamba
          persist-credentials: false

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-g7-mamba-import.txt

      - name: Install isolated Mamba2 CPU-import dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt -r requirements-g7-mamba-import.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Import exact native Mamba2 and construct model
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/g7_mamba2_import.py --mamba-root _upstream/mamba --receipt local_runs/g7_mamba_import.json

      - name: Retain evidence, including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-g7-mamba2-import-${{ github.event.pull_request.head.sha || github.sha }}
          path: local_runs/g7_mamba_import.json
          if-no-files-found: warn
          retention-days: 30
