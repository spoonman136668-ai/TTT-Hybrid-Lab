# G7-R30 one-use, no-retry, read-only comparison of original and
# post-LIBRARY_PATH Gate3 exception signatures. No model/GPU/kernel execution.
name: G7-R30 original versus process-local CUDA link native failure delta
on:
  push:
    branches:
      - engineering/g7-r30-readonly-postlink-gate3-delta-20261107
    paths:
      - .github/workflows/g7-r30-original-vs-postlink-readonly.yml

permissions:
  contents: read

concurrency:
  group: ttt-g7-r30-one-use-original-postlink-delta
  cancel-in-progress: false

jobs:
  old-new-gate3-delta:
    if: ${{ github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/g7-r30-readonly-postlink-gate3-delta-20261107' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 4
    steps:
      - name: Pin both original receipts and classify postlink exception delta
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $r = [ordered]@{
            schema = 'ttt-hybrid.g7-r30.postlink-native-failure-delta.v1'
            candidate_sha = $env:GITHUB_SHA
            prior_original_run = 42360001917
            prior_postlink_run = 42361640612
            original_r23_candidate = 'e86f934cc1f999794a47afd14e8646f10519dbe1'
            postlink_r29_candidate = '98070114b6d1975df487ea6670ebddfd6ee1068d'
            status = 'BLOCKED_NOT_STARTED'
            old_gate3_custody = 'UNVERIFIED'
            new_gate3_custody = 'UNVERIFIED'
            new_gate3_sha256 = 'UNVERIFIED'
            old_error_fingerprint = 'f8797421feaf9e3c8650aec068d886e4fc9033166e1e7d6183c445be635885a6'
            new_error_fingerprint = 'UNVERIFIED'
            same_error_fingerprint = $null
            new_error_class = 'UNVERIFIED'
            new_exit_status = $null
            new_process_executable = 'UNVERIFIED'
            new_command_tags = @()
            python312_header_present = 'UNVERIFIED'
            gpu = 'NOT_RUN'
            package_changes = 'NONE'
            training = 'NOT_RUN'
            deployment = 'NOT_AUTHORIZED'
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'local_runs'
          try {
            if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or
                $env:GITHUB_REF -cne 'refs/heads/engineering/g7-r30-readonly-postlink-gate3-delta-20261107' -or
                $env:GITHUB_EVENT_NAME -cne 'push' -or
                $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
                $env:GITHUB_RUN_NUMBER -cne '1' -or
                $env:GITHUB_RUN_ATTEMPT -cne '1' -or
                $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or
                $env:RUNNER_OS -cne 'Windows') {
              $r.status = 'BLOCKED_OWNER_RUNNER_IDENTITY'
              throw 'G7_R30_WRONG_OWNER_RUNNER'
            }
            $old = Join-Path $env:GITHUB_WORKSPACE 'local_runs/g7_native_gate3_subreceipt.json'
            $nested = Join-Path $env:GITHUB_WORKSPACE 'g7-r29-isolated/local_runs'
            $new = Join-Path $nested 'g7_native_gate3_subreceipt.json'
            $newR6 = Join-Path $nested 'g7_r15_native_forward.json'
            $r29Outer = Join-Path $nested 'g7_r29_process_local_forward.json'
            if (-not (Test-Path -LiteralPath $old -PathType Leaf) -or
                -not (Test-Path -LiteralPath $new -PathType Leaf) -or
                -not (Test-Path -LiteralPath $newR6 -PathType Leaf) -or
                -not (Test-Path -LiteralPath $r29Outer -PathType Leaf)) {
              $r.status = 'BLOCKED_MISSING_ORIGINAL_OR_POSTLINK_RECEIPT'
              throw 'G7_R30_RECEIPT_MISSING'
            }
            $oldhash = (Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant()
            $newhash = (Get-FileHash -LiteralPath $new -Algorithm SHA256).Hash.ToLowerInvariant()
            $r6hash = (Get-FileHash -LiteralPath $newR6 -Algorithm SHA256).Hash.ToLowerInvariant()
            $r29hash = (Get-FileHash -LiteralPath $r29Outer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($oldhash -cne 'e463c6a1a357bbc594509878bc02ca0cce375d472dbb3cd9ef224af951b64b35' -or
                $r6hash -cne '3adaa2f8eefc62a41f535aef75f8c9691d4055f9eee52cc139b04eb25bc93305' -or
                $r29hash -cne '5907404f7f4447fba20e29c769c5e007e09427ca9a9bc0c224139580123600d6') {
              $r.status = 'BLOCKED_IMMUTABLE_RECEIPT_HASH_DRIFT'
              throw 'G7_R30_RECEIPT_HASH_DRIFT'
            }
            $r.old_gate3_custody = 'PASS_ORIGINAL_PINNED_SHA'
            $r6 = Get-Content -LiteralPath $newR6 -Raw -Encoding UTF8 | ConvertFrom-Json
            $g = Get-Content -LiteralPath $new -Raw -Encoding UTF8 | ConvertFrom-Json
            $wrap = Get-Content -LiteralPath $r29Outer -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($r6.candidate_sha -cne $r.postlink_r29_candidate -or
                $r6.native_gate3_receipt_sha256 -cne $newhash -or
                $wrap.candidate_sha -cne $r.postlink_r29_candidate -or
                $wrap.link_probe -cne 'PASS_PROCESS_LOCAL_GCC_LIBCUDA_LINK' -or
                $g.status -cne 'FAIL_AUTHENTIC_GPU_INTEGRATION' -or
                $g.mode -cne 'FORWARD_ONLY_NO_GRAD' -or
                $g.schema -cne 'ttt-hybrid.authentic-gpu-smoke.v1') {
              $r.status = 'BLOCKED_POSTLINK_RECEIPT_IDENTITY'
              throw 'G7_R30_POSTLINK_RECEIPT_IDENTITY'
            }
            $r.new_gate3_custody = 'PASS_POSTLINK_R6_GATE3_HASH_CHAIN'
            $r.new_gate3_sha256 = $newhash
            $message = [string]$g.error_message
            $tail = @($g.traceback_tail | Select-Object -Last 10)
            $raw = $message + [Environment]::NewLine + ($tail -join [Environment]::NewLine)
            if ($raw.Length -gt 11000) { $raw = $raw.Substring(0,11000) }
            $hasher = [System.Security.Cryptography.SHA256]::Create()
            try {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($raw)
              $fingerprint = ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace('-','').ToLowerInvariant()
            } finally { $hasher.Dispose() }
            $r.new_error_fingerprint = $fingerprint
            $r.same_error_fingerprint = ($fingerprint -ceq $r.old_error_fingerprint)
            $etype = [string]$g.error_type
            $r.new_error_class = if ($etype -cmatch '^[A-Za-z][A-Za-z0-9_]{0,79}$') { $etype } else { 'OTHER_EXCEPTION' }
            $exitM = [regex]::Match($raw, '(?i)returned non-zero exit status\s+([0-9]{1,3})')
            if ($exitM.Success) {
              $exit = [int]$exitM.Groups[1].Value
              if ($exit -ge 0 -and $exit -le 255) { $r.new_exit_status = $exit }
            }
            $command = [regex]::Match($message, "^[Cc]ommand\s+'\[\s*'([^']+)'")
            if ($command.Success) {
              $leaf = [regex]::Match($command.Groups[1].Value, '[^\\/]+$').Value.ToLowerInvariant()
              if ($leaf -in @('x86_64-linux-gnu-gcc-13','gcc','gcc-13',
                             'ptxas','clang','ld','nvcc','python3')) {
                $r.new_process_executable = $leaf
              } else { $r.new_process_executable = 'OTHER_PROCESS' }
            } else { $r.new_process_executable = 'NOT_PARSEABLE' }
            $flags = [ordered]@{
              SHARED_OBJECT = '(?i)-shared'
              PIC = '(?i)-fPIC'
              CUDA_DRIVER_LINK = '(?i)-lcuda\b|libcuda[.]so'
              PYTHON_HEADER = '(?i)Python[.]h'
              CUDA_HEADER = '(?i)\bcuda[.]h'
              TRITON_HOST = '(?i)\btriton\b|cuda_utils[.]c'
              PYTHON_INCLUDE_PATH = '(?i)(?:-I[^\s]+python3[.]12)'
              FILE_NOT_FOUND = '(?i)no such file or directory|cannot find'
            }
            $tags = @()
            foreach ($name in $flags.Keys) {
              if ($raw -match $flags[$name]) { $tags += $name }
            }
            $r.new_command_tags = $tags
            $header = & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/test -f /usr/include/python3.12/Python.h 2>$null
            $r.python312_header_present = if ($LASTEXITCODE -eq 0) { 'YES_DISTRO_INCLUDE' } else { 'NO_DISTRO_INCLUDE' }
            $r.status = 'PASS_POSTLINK_NATIVE_FAILURE_DELTA'
          } finally {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            $r | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'g7_r30_postlink_failure_delta.json') -Encoding UTF8
            Write-Output ('G7_R30_STATUS=' + $r.status)
            Write-Output ('G7_R30_CLASS=' + $r.new_error_class)
            Write-Output ('G7_R30_SAME=' + [string]$r.same_error_fingerprint)
            Write-Output ('G7_R30_EXE=' + $r.new_process_executable)
            Write-Output ('G7_R30_TAGS=' + ($r.new_command_tags -join ','))
            Write-Output 'G7_R30_GPU=NOT_RUN'
          }
      - name: Preserve only sanitized original-versus-postlink delta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-g7-r30-postlink-native-failure-delta
          path: local_runs/g7_r30_postlink_failure_delta.json
          if-no-files-found: warn
          retention-days: 30
