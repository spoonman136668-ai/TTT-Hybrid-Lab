name: G4 CPU qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-qualification:
    name: CPU qualification / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install CPU-only PyTorch and test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Full tests and admission-negative control
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/qualify_cpu.py --receipt local_runs/cpu_qualification.json

      - name: R103 original-source-free CPU capacity feasibility (UNIT_ONLY)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 299 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r103-relational-binding-20261116' && hashFiles('experiments/r103_cpu_firstuse_authorization.json') == '' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r103_capacity_probe

      - name: R104 independent 256-operator physical information audit (UNIT_ONLY)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 300 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r104-operator-identifiability-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r104_operator_identifiability_diagnostic

      - name: R105 three-seed seven-arm native causal role binding UNIT_ONLY pilot
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 301 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r105-role-aligned-native-inference-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r105_native_role_binding_diagnostic

      - name: R106 frozen three-seed eight-trainable-arm eight-slot UNIT_ONLY pilot
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 302 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r106-eight-slot-causal-memory-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r106_eight_slot_causal_memory_diagnostic

      - name: R107 fresh two-phase correction retention UNIT_ONLY causal experiment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 303 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r107-phase-correction-retention-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r107_phase_correction_retention_diagnostic

      - name: R108 frozen evidence-routed causal memory UNIT_ONLY development
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r108-evidence-routed-memory-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r108_evidence_routed_memory_diagnostic

      - name: R109 frozen identifiable conditional memory UNIT_ONLY development
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r109-identifiable-routing-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r109_identifiable_router_diagnostic

      - name: R110 frozen public contradiction-credit UNIT_ONLY development
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r110-public-contradiction-credit-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r110_contradiction_credit_diagnostic

      - name: R111 frozen active chosen causal probes UNIT_ONLY development
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r111-active-causal-probing-20261116' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r111_active_probe_diagnostic

      - name: R112 frozen FIT-VALID only integer portable probe qualification
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r112-portable-probe-selection-20261117' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r112_portable_probe_diagnostic

      - name: R113 frozen unfamiliar causal composition active interventions UNIT_ONLY
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r113-structured-causal-active-probe-20261117' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r113_structured_active_probe_diagnostic

      - name: R114 original FIT-VALID only exact integer Bayesian readout portability
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r114-exact-causal-bayes-readout-20261117' }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r114_exact_readout_diagnostic

      - name: Store immutable run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-g4-cpu-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: local_runs/*.json
          if-no-files-found: warn
          retention-days: 30


  # One CPU-only development training milestone attached to the EXISTING G4
  # qualification workflow. No new scheduled trigger, runner, controller, or
  # privileged GPU action. Only the original R76 PR branch, once per job
  # attempt, can run a bounded 1024-update full-width FIT training.
  r76-first-fit-milestone:
    name: R76 first 1024 actual FIT updates / ubuntu-latest
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r76-max-width-1024-fit-checkpoint-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Checkout exact candidate, no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Pin CPU Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install original pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Train original full-width R75 Hybrid and both conventional controls on FIT only
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r76_fit_milestone

      - name: Preserve original FIT receipt and whole optimizer/RNG checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r76-original-FIT-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            local_runs/r76_fit_milestone.json
            local_runs/r75_cumulative_fit/*.pt
          if-no-files-found: warn
          retention-days: 30


  # One immutable-source lineage bridge on the original already-qualified
  # hosted Ubuntu CPU G4 workflow. Not a schedule or rival runner/controller.
  # The original R76 checkpoint is never overwritten and 2048 is only
  # operational escrow (not a new R74 frozen scientific milestone).
  r77-original-checkpoint-continuation:
    name: R77 verified original 1024→2048 FIT continuation / ubuntu-latest
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r77-verified-1024-to-2048-resume-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      - name: Pin the original CPU Python toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install exact CPU-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Verify original R76 published Actions artifact digest and source
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m experiments.r77_verified_resume --verify-artifact

      - name: Read-only download of EXACT original R76 1024-step artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: ttt-hybrid-r76-original-FIT-b034eeb054763b5f8423a3413af2655ff0facb03-43711769367
          run-id: 43711769367
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: spoonman136668-ai/TTT-Hybrid-Lab
          path: local_runs/r77_input

      - name: Verify all ORIGINAL checkpoint hashes then train only unseen FIT steps 1025 to 2048
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m experiments.r77_verified_resume --run

      - name: Preserve private original R77 progress and new full optimizer/RNG escrow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r77-resume-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            local_runs/r77_verified_original_artifact.json
            local_runs/r77_continuation_receipt.json
            local_runs/r77_intermediate/*.pt
          if-no-files-found: warn
          retention-days: 30


  # R78 two sequential 29-min upper-width FIT jobs under EXISTING G4 only.
  # The prior original R76/R77 jobs are branch-gated and skipped here.
  # No new scheduler, new workflow, self-hosted runner or protected GPU use.
  r78-max-width-stage1:
    name: R78 original 2048 to 3072 FIT continuation / ubuntu-latest
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r78-verified-two-chunk-2048-to-4096-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact R78 SHA without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: Pin R75 original Python and CPU-only dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install original CPU-only environment
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Verify immutable source R77 artifact metadata before downloading
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R78_STAGE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m experiments.r78_4096_continuation --stage 1 --verify-artifact

      - name: Fetch only original private R77 checkpoint artifact from pinned run
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: ttt-hybrid-r77-resume-7af6784d814224988a77aab98146d61c906325cc-43719168985
          repository: spoonman136668-ai/TTT-Hybrid-Lab
          run-id: 43719168985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: local_runs/r78_import_r77

      - name: Cold-verify all original optimizer/RNG state then train only 2049 to 3072
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R78_STAGE: '1'
        run: python -m experiments.r78_4096_continuation --stage 1 --run

      - name: Preserve original stage 1 private full optimizer escrow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r78-stage1-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            local_runs/r78_api_stage1.json
            local_runs/r78_stage1_receipt.json
            local_runs/r78_stage1/*.pt
          if-no-files-found: warn
          retention-days: 30

  r78-max-width-stage2:
    name: R78 original 3072 to 4096 FIT continuation / ubuntu-latest
    needs: r78-max-width-stage1
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r78-verified-two-chunk-2048-to-4096-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout unchanged R78 SHA for second continuation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: Pin identical original CPU torch and NumPy versions
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install original CPU-only environment
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Verify stage1 same-run original artifact through read-only GitHub metadata
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R78_STAGE: '2'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m experiments.r78_4096_continuation --stage 2 --verify-artifact

      - name: Download exact current run stage1 private optimizer escrow
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: ttt-hybrid-r78-stage1-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          repository: spoonman136668-ai/TTT-Hybrid-Lab
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: local_runs/r78_import_stage1

      - name: Cold-verify 3072 checkpoints and continue 3073 to frozen 4096
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R78_STAGE: '2'
        run: python -m experiments.r78_4096_continuation --stage 2 --run

      - name: Preserve original 4096 CPU model/optimizer/RNG checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r78-stage2-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            local_runs/r78_api_stage2.json
            local_runs/r78_stage2_receipt.json
            local_runs/r78_stage2/*.pt
          if-no-files-found: warn
          retention-days: 30


  # R80: two isolated one-shot fresh-source native CPU learning comparisons
  # on EXISTING original G4; requires both OS full regression before first use.
  # No new schedule/runner/controller or protected prior DEV/OOD source.
  r80-fresh-matched-training:
    name: R80 fresh router learning / seed ${{ matrix.seed }}
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r80-fresh-matched-router-learning-20261115' }}
    strategy:
      fail-fast: false
      matrix:
        seed: [998211, 998223]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
    steps:
      - name: Checkout exact R80 candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: Pin original CPU Python and test dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install pinned original CPU dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Actual matched training then first-use frozen fresh DEV and OOD
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R80_SEED: ${{ matrix.seed }}
        run: python -m experiments.r80_fresh_router_learning --seed ${{ matrix.seed }}

      - name: Preserve original per-seed science DEVELOPMENT receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r80-fresh-DEV-seed${{ matrix.seed }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: local_runs/r80_fresh_router_learning_seed${{ matrix.seed }}.json
          if-no-files-found: warn
          retention-days: 30


  # R81 two original isolated CPU training jobs on the EXISTING mandatory G4
  # workflow. Exact source, after BOTH platform regressions pass, no retries.
  # Fresh DEV/OOD first-use is in each original single-use per-seed job ONLY.
  r81-first-intervention-learning:
    name: R81 paired intervention causal-history / seed ${{ matrix.seed }}
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r81-paired-intervention-history-dependence-20261115' }}
    strategy:
      fail-fast: false
      matrix:
        seed: [998431, 998443]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
    steps:
      - name: Checkout exact prospectively frozen source with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: Pin original CPU Python test toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install exact pinned original CPU dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Train all six factual controls then first-use fresh heldout paired physical interventions
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          R81_SEED: ${{ matrix.seed }}
        run: python -m experiments.r81_paired_history --seed ${{ matrix.seed }}

      - name: Preserve exact original first-use DEV/OOD experiment receipt privately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-r81-history-seed${{ matrix.seed }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: local_runs/r81_paired_history_seed${{ matrix.seed }}.json
          if-no-files-found: warn
          retention-days: 30


  # R82 genuine selected action-value policy from fresh factual worlds.
  # Only existing G4 workflow; exact branch, two independent hosted CPU seeds,
  # admitted AFTER mandatory both-OS full repo tests and source guards PASS.
  r82-active-factual-value:
    name: R82 active intervention value / seed ${{ matrix.seed }}
    needs: cpu-qualification
    if: ${{ github.event_name == 'pull_request' && github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r82-active-calibration-value-20261115' }}
    strategy:
      fail-fast: false
      matrix:
        seed: [998621, 998633]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: Pin original 3.11 Python CPU toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
