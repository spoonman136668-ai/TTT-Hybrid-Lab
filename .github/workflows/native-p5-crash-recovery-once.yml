# P5 one-use, project-owned CPU-only PROCESS-crash rehearsal.
# Existing isolated Hybrid runner; no external disk writes, model deployment or science.
name: Native P5 process crash recovery one-use
on:
  push:
    branches:
      - engineering/native-process-crash-recovery-p5-20261108
    paths:
      - .github/workflows/native-p5-crash-recovery-once.yml
permissions:
  contents: read
concurrency:
  group: native-p5-process-crash-oneuse
  cancel-in-progress: false
jobs:
  windows-and-wsl:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-process-crash-recovery-p5-20261108' && github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: native-p5-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 180
      - name: Verify exact P4 ancestor, source blobs and zero original-science scope
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'BLOCKED_PROJECT_RUNNER_ONEUSE'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p5-candidate'
          $head=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA){throw 'BLOCKED_EXACT_SOURCE'}
          $dirty=(& git -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $dirty){throw 'BLOCKED_DIRTY_SOURCE'}
          & git -C $root merge-base --is-ancestor 'e92774bae8a1d27301492b650892011e702d8257' HEAD
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_P4_ANCESTOR'}
          $expected=@{
            'source_pins.json'='1438b51f8548db6bfe7e04805ba8c156e4b5b630';
            'native_continuous_state.py'='38ebbfb339026f3213a8c380e090480609288917';
            'scripts/native_prequential_gate.py'='fe1016f19a8671d071f7f2230e9dcf0e96cf282f';
            'scripts/native_p1_conventional_controls.py'='197e7ce4044bd5e8b533545985f93a90a1d0451c';
            'experiments/native_p1_control_admission_preflight.json'='9de1caedb56f1248264ac37db08ec66b8265fe16';
            'native_training_checkpoint.py'='57728c0fc164cf5954449cec86f31b9c0e9d16e8';
            'tests/test_native_training_checkpoint.py'='c40c30ba6dccb05921b053b91ee7b033718b554a';
            'native_capability_registry.py'='b81f36caa615dcc3f679de3b401fc1c10237dfe9';
            'tests/test_native_capability_registry.py'='b3a76d091abfcad4ee40ab6d0c2cbabdc8eea6cf';
            'native_checkpoint_recovery.py'='01542adb60e64a393aed074dd99e82ffee3e666a';
            'tests/test_native_checkpoint_recovery.py'='decbf7b729f278067eb9f314a0c2e6ae1ee88694';
            'scripts/native_p5_crash_rehearsal.py'='a6746746116b0ef709123a2825ebd4045e2ac5a4';
            'tests/test_native_p5_crash_rehearsal.py'='800e4e70b9efaa39d01ae5172768e5de1e95bcf7';
            'docs/PROCESS_CRASH_RECOVERY.md'='e9763cf909841550b5c12aea09118ba258bae2c6'
          }
          foreach($name in $expected.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $expected[$name]){throw "BLOCKED_SOURCE_BLOB:$name"}
          }
          $p=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p1_control_admission_preflight.json') -Raw|ConvertFrom-Json
          if($p.science.authorized -ne $false -or $p.science.data_consumed -ne $false -or @($p.science.seeds.PSObject.Properties).Count -ne 0 -or $p.engineering.model_fit_real_world -ne $false){throw 'BLOCKED_SCIENCE_FIRSTUSE_SCOPE'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'BLOCKED_WIN_RUNTIME'}
          $torch=(& $py -I -B -c 'import torch;print(torch.__version__)'|Out-String).Trim()
          $pytest=(& $py -I -B -c 'import pytest;print(pytest.__version__)'|Out-String).Trim()
          if($torch -cne '2.5.1+cpu' -or $pytest -cne '8.3.4'){throw 'BLOCKED_WIN_RUNTIME_VERSION'}
          Write-Output 'NATIVE_P5_PINNED_ANCESTRY_BLOBS_ZERO_SCIENCE=PASS'
      - name: Full Windows regression and real process-crash recovery
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'native-p5-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p5_windows.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WIN_FULL_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p5_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WIN_RECEIPT'}
          if($q.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 179){throw 'BLOCKED_WIN_MISSING_NEW_TESTS'}
          & $py -I -B (Join-Path $root 'scripts\native_p5_crash_rehearsal.py') --receipt (Join-Path $root 'local_runs\native_p5_windows_crash.json')
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WIN_PROCESS_CRASH'}
          $c=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p5_windows_crash.json') -Raw|ConvertFrom-Json
          if($c.status -cne 'PASS_SYNTHETIC_PROCESS_CRASH_RECOVERY_ONLY' -or $c.child_exit_code -ne 73 -or $c.off_host_failure_domain_verified -ne $false -or $c.model_promoted -ne $false -or $c.training_activated -ne $false){throw 'BLOCKED_WIN_CRASH_RECEIPT'}
          Write-Output 'NATIVE_P5_WINDOWS_FULL_AND_PROCESS_CRASH=PASS_ENGINEERING_ONLY'
      - name: Full WSL regression and real process-crash recovery
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $lp -or -not $who){throw 'BLOCKED_WSL_OWNER'}
          $root="$lp/native-p5-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          $receipt="$root/local_runs/native_p5_linux.json"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt $receipt
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WSL_FULL_REGRESSION'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p5-candidate\local_runs\native_p5_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'BLOCKED_WSL_RECEIPT'}
          if($q.tests.stdout_tail -notmatch '(\d+) passed' -or [int]$Matches[1] -lt 178){throw 'BLOCKED_WSL_MISSING_NEW_TESTS'}
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/env 'CUDA_VISIBLE_DEVICES=-1' 'PYTHONDONTWRITEBYTECODE=1' $py -I -B "$root/scripts/native_p5_crash_rehearsal.py" --receipt "$root/local_runs/native_p5_linux_crash.json"
          if($LASTEXITCODE -ne 0){throw 'BLOCKED_WSL_PROCESS_CRASH'}
          $c=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'native-p5-candidate\local_runs\native_p5_linux_crash.json') -Raw|ConvertFrom-Json
          if($c.status -cne 'PASS_SYNTHETIC_PROCESS_CRASH_RECOVERY_ONLY' -or $c.child_exit_code -ne 73 -or $c.off_host_failure_domain_verified -ne $false -or $c.model_promoted -ne $false -or $c.training_activated -ne $false){throw 'BLOCKED_WSL_CRASH_RECEIPT'}
          Write-Output 'NATIVE_P5_WSL_FULL_AND_PROCESS_CRASH=PASS_ENGINEERING_ONLY'
      - name: Retain exact-source Windows and WSL regression and crash receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p5-process-crash-engineering-oneuse
          path: native-p5-candidate/local_runs/native_p5_*.json
          retention-days: 30
          if-no-files-found: warn
