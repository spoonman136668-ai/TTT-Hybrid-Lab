# P20 source-pinned velocity-blind history falsification, public DEV only.
name: Native P20 velocity-blind real-source causal-history test once
on:
  push:
    branches:
      - engineering/native-p20-velocity-blind-history-dev-20261108
    paths:
      - .github/workflows/native-p20-velocity-blind-history-once.yml
permissions:
  contents: read
concurrency:
  group: native-p20-velocity-blind-history-once
  cancel-in-progress: false
jobs:
  real-dev-calibration:
    if: github.repository == 'spoonman136668-ai/TTT-Hybrid-Lab' && github.ref == 'refs/heads/engineering/native-p20-velocity-blind-history-dev-20261108' && github.actor == 'spoonman136668-ai' && github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, ttt-hybrid-gpu-isolated]
    timeout-minutes: 25
    steps:
      - name: Checkout exact P20 candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: p20-candidate
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 180
      - name: Checkout original separately owned S29 admission code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: spoonman136668-ai/TTT-Hybrid-Lab
          ref: 30c27ca4865e16b7574ee2b562879108db2b3796
          path: p20-s29-owner
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Checkout actual upstream pinned MIT source, no package install
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Farama-Foundation/Gymnasium
          ref: 17eff00220d210beda933f78b0e52850022b0690
          path: p20-mit-gym
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Checkout actual upstream pinned BSD3 dependency, no installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cloudpipe/cloudpickle
          ref: ff54d93221082d4ce22630ecdb8fbbccc60f3b62
          path: p20-bsd3-cloudpickle
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Verify original P18/P19 custody and frozen P20 science/data/masking sources
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/TTT-Hybrid-Lab' -or $env:RUNNER_NAME -cne 'TTT-HYBRID-GPU-WIN' -or $env:GITHUB_RUN_NUMBER -cne '1' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'P20_OWNER_ONE_USE_DENIED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'p20-candidate'
          $s29=Join-Path $env:GITHUB_WORKSPACE 'p20-s29-owner'
          $mit=Join-Path $env:GITHUB_WORKSPACE 'p20-mit-gym'
          $bsd=Join-Path $env:GITHUB_WORKSPACE 'p20-bsd3-cloudpickle'
          $actual=(& git -C $root rev-parse HEAD|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA){throw 'P20_CANDIDATE_SHA_MISMATCH'}
          & git -C $root merge-base --is-ancestor 'd7e1535f615c7f9f0ca70b2ab9059fdf1f912726' HEAD
          if($LASTEXITCODE -ne 0){throw 'P20_P19_VERIFIED_PARENT_DRIFT'}
          $expected=@{
            'experiments/native_p20_velocity_blind_history_frozen.json'='cdfe8341cc3d585f84c4df0ae9242e197b3d12f6';
            'scripts/native_p20_velocity_blind_history_dev.py'='99ebe68151642a5c7a9f5efd95923e4450086155';
            'tests/test_native_p20_velocity_blind_history_dev.py'='a9f900e9dd5928483677ce182cd9163d3365de3e';
            'experiments/native_p19_expert_calibration_frozen.json'='cbaa42bfba413ffc9f1b3c9f9db6faa93a542da3';
            'scripts/native_p19_expert_calibration_dev.py'='7fb65ed5bc59fc2ad7a8c8442624b3d21fb86c5d';
            'tests/test_native_p19_expert_calibration_dev.py'='bdf4137048ad3b155724b01c742699f1f20167d7';
            'scripts/native_p18_real_cartpole_factual_dev.py'='0c5c0079614624d1264e477ea90b483cbe63d586';
            'tests/test_native_p18_real_cartpole_factual_dev.py'='a97458f5a9bc1bedc9e2e941cc0bddc987e27bc3';
            'experiments/native_p18_real_cartpole_factual_frozen.json'='fd4828f971acb7e052dc6ff7f78314267bef202b'
          }
          foreach($name in $expected.Keys){
            $blob=(& git -C $root hash-object -- $name|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $expected[$name]){throw "P20_FROZEN_BLOB_DRIFT:$name"}
          }
          if((& git -C $s29 rev-parse HEAD|Out-String).Trim() -cne '30c27ca4865e16b7574ee2b562879108db2b3796' -or (& git -C $mit rev-parse HEAD|Out-String).Trim() -cne '17eff00220d210beda933f78b0e52850022b0690' -or (& git -C $bsd rev-parse HEAD|Out-String).Trim() -cne 'ff54d93221082d4ce22630ecdb8fbbccc60f3b62'){throw 'P20_EXTERNAL_SOURCE_IDENTITY_DRIFT'}
          foreach($d in @($root,$s29,$mit,$bsd)){
            $dirty=(& git -C $d status --porcelain --untracked-files=all|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $dirty){throw "P20_SOURCE_NOT_CLEAN:$d"}
          }
          $f=Get-Content -LiteralPath (Join-Path $root 'experiments/native_p20_velocity_blind_history_frozen.json') -Raw|ConvertFrom-Json
          if($f.schema -cne 'ttt-hybrid.native-p20.velocity-blind-history-frozen.v1' -or $f.scientific_boundary.first_use_authorized -ne $false -or $f.scientific_boundary.sealed_scientific_data_consumed -ne $false -or $f.design.supervised_epochs -ne 32 -or @($f.design.evaluation_seeds).Count -ne 8 -or $f.stack.p19_exact_sha -cne 'd7e1535f615c7f9f0ca70b2ab9059fdf1f912726'){throw 'P20_SCIENCE_FENCE_OR_PROTOCOL_DRIFT'}
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'P20_EXISTING_CPU_OWNER_ENV_MISSING'}
          $versions=@(& $py -I -B -c 'import torch,pytest,numpy;print(torch.__version__);print(pytest.__version__);print(numpy.__version__)')
          if($LASTEXITCODE -ne 0 -or $versions.Count -ne 3 -or $versions[0] -cne '2.5.1+cpu' -or $versions[1] -cne '8.3.4' -or $versions[2] -cne '1.26.4'){throw 'P20_OWNER_DEPENDENCY_DRIFT'}
          Write-Output 'P20_EXACT_SOURCE_AND_ORIGINAL_NEGATIVES=PASS'
      - name: Mandatory original full Windows regression plus CUDA negatives
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'p20-candidate'
          $py=Join-Path $env:RUNNER_WORKSPACE '_g7_s25_cpu311_r1\venv\Scripts\python.exe'
          $env:EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA
          $env:CUDA_VISIBLE_DEVICES='-1';$env:OMP_NUM_THREADS='1';$env:PYTHONDONTWRITEBYTECODE='1';$env:PYTHONHASHSEED='0'
          & $py -I -B (Join-Path $root 'scripts\qualify_cpu.py') --receipt (Join-Path $root 'local_runs\native_p20_windows.json')
          if($LASTEXITCODE -ne 0){throw 'P20_WINDOWS_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $root 'local_runs\native_p20_windows.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P20_WINDOWS_ORIGINAL_NEGATIVE_FAIL'}
          Write-Output 'P20_WINDOWS_FULL_EXACT_SHA=PASS'
      - name: Mandatory original full Ubuntu WSL regression plus source negatives
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          $uid=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -u|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $uid -cne '1000' -or -not $who -or -not $lp){throw 'P20_WSL_OWNER_DRIFT'}
          $root="$lp/p20-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 650s /usr/bin/env "EXPECTED_CANDIDATE_SHA=$env:GITHUB_SHA" 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/qualify_cpu.py" --receipt "$root/local_runs/native_p20_linux.json"
          if($LASTEXITCODE -ne 0){throw 'P20_WSL_FULL_REGRESSION_FAILED'}
          $q=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'p20-candidate\local_runs\native_p20_linux.json') -Raw|ConvertFrom-Json
          if($q.status -cne 'PASS_CPU_ENGINEERING_ONLY' -or $q.revision -cne $env:GITHUB_SHA -or $q.tests.exit_code -ne 0 -or $q.negative_control.pass -ne $true){throw 'P20_WSL_ORIGINAL_NEGATIVE_FAIL'}
          Write-Output 'P20_LINUX_FULL_EXACT_SHA=PASS'
      - name: One bounded public DEV real-source causal-history dependency trial
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $lp=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/wslpath -u "$env:GITHUB_WORKSPACE"|Out-String).Trim()
          $who=(& wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/id -un|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or -not $lp -or -not $who){throw 'P20_WSL_SOURCE_MISSING'}
          $root="$lp/p20-candidate"
          $py="/home/$who/.local/share/ttt-hybrid/g7-s25-cpu311-r1/venv/bin/python"
          & wsl.exe --distribution Ubuntu-24.04 --exec /usr/bin/timeout --signal=TERM --kill-after=5s 290s /usr/bin/env 'NATIVE_P20_DEV_ONLY=1' 'CUDA_VISIBLE_DEVICES=-1' 'OMP_NUM_THREADS=1' 'PYTHONDONTWRITEBYTECODE=1' 'PYTHONHASHSEED=0' $py -I -B "$root/scripts/native_p20_velocity_blind_history_dev.py" --s29-root "$lp/p20-s29-owner" --source-root "$lp/p20-mit-gym" --cloudpickle-root "$lp/p20-bsd3-cloudpickle" --receipt "$root/local_runs/native_p20_real_cartpole.json"
          if($LASTEXITCODE -ne 0){throw 'P20_PUBLIC_DEV_CAPABILITY_CALIBRATION_FAILED'}
          $p=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'p20-candidate\local_runs\native_p20_real_cartpole.json') -Raw|ConvertFrom-Json
          if($p.status -cne 'PASS_EXTERNAL_DEV_ENGINEERING_NOT_SCIENCE' -or $p.scientific_first_use -cne 'NOT_RUN' -or @($p.protected_scientific_world_seeds_consumed).Count -ne 0 -or @($p.per_seed).Count -ne 3 -or @($p.public_dev_eval_reset_seeds).Count -ne 8 -or $p.supervised_teacher_not_reward_only -ne $true -or $p.scientific_transfer_or_superiority_established -ne $false){throw 'P20_RECEIPT_INTEGRITY_FAIL'}
          Write-Output "P20_DEV_ENGINEERING=PASS MEANINGFUL_HISTORY_SUPPORT=$($p.supporting_initializations_of_three)/3 SCIENTIFIC_FIRST_USE=NOT_RUN"
      - name: Preserve exact regression, demonstration, full negative and null receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-p20-velocity-blind-history-once
          path: p20-candidate/local_runs/native_p20_*.json
          retention-days: 30
          if-no-files-found: warn
