name: G4 CPU qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttt-hybrid-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-qualification:
    name: CPU qualification / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install CPU-only PyTorch and test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Full tests and admission-negative control
        run: python scripts/qualify_cpu.py --receipt local_runs/cpu_qualification.json

      - name: Store immutable run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ttt-hybrid-g4-cpu-${{ matrix.os }}-${{ github.sha }}
          path: local_runs/*.json
          if-no-files-found: warn
          retention-days: 30
